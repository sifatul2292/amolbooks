<script>

    _checkoutFired=true;
    var val=cartVal(items);
    var dl=window.dataLayer;
    dl.push({ecommerce:null});
    dl.push({event:'begin_checkout_stape',ecommerce:{currency:'BDT',value:val,items:items},__stape:true});
  }

  var _purchaseFired=false;
  var _lastOrderUserData=null; /* stores user_data from last add-order-by for NestJS CAPI injection */

  function _getCookie(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n.replace(/([.*+?^${}()|[\]\\])/g,'\\$1')+'=([^;]*)'));return m?decodeURIComponent(m[1]):'';}

  /* Persistent first-party id -> Meta external_id (stable per browser, 100% coverage). */
  function _xid(){
    try{
      var k='_ab_xid',v=localStorage.getItem(k);
      if(!v){v=(Date.now().toString(36)+Math.random().toString(36).slice(2,10));localStorage.setItem(k,v);}
      return v;
    }catch(e){return '';}
  }

  /* ── XHR intercept: populate _localCart from cart/product APIs; fire purchase ── */
  var _xhrOpen=XMLHttpRequest.prototype.open;
  var _xhrSend=XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open=function(m,u){this._gm=m;this._gu=String(u||'');return _xhrOpen.apply(this,arguments);};
  XMLHttpRequest.prototype.send=function(body){
    var self=this;
    /* Inject stored user_data into NestJS purchase CAPI tracking call */
    if(self._gu&&self._gu.indexOf('track-theme-purchase')!==-1&&_lastOrderUserData&&body){
      try{
        var _p=JSON.parse(body);
        if(!_p.user_data){_p.user_data=_lastOrderUserData;body=JSON.stringify(_p);}
      }catch(e){}
    }
    self._gbody=body;
    var _done=false;
    function handle(){
      if(_done)return;_done=true;
      try{
        var u=self._gu||'';
        var d;try{d=JSON.parse(self.responseText);}catch(e){return;}
        if(!d||!d.success)return;

        /* Add to cart: POST /api/cart/add-to-cart */
        if(u.indexOf('add-to-cart')!==-1&&d.data){
          var atcItem={item_id:'',item_name:'',price:0,quantity:1};
          var atcP=typeof d.data.product==='object'?d.data.product:(d.data.product?{_id:d.data.product}:{});
          atcItem.item_id=String(atcP._id||d.data.product||'');
          atcItem.item_name=atcP.name||'';
          atcItem.price=atcP.salePrice||atcP.regularPrice||0;
          atcItem.quantity=d.data.selectedQty||1;
          var atcVal=atcItem.price*atcItem.quantity;
          window.dataLayer.push({ecommerce:null});
          window.dataLayer.push({event:'add_to_cart',ecommerce:{currency:'BDT',value:atcVal,items:[atcItem]}});
          return;
        }

        /* Logged-in user cart: GET /api/cart/get-carts-by-user */
        if(u.indexOf('/cart')!==-1&&Array.isArray(d.data)){
          var items=[];
          d.data.forEach(function(i){
            if(!i||!i.product)return;
            var p=typeof i.product==='object'?i.product:{};
            items.push({item_id:String(p._id||''),item_name:p.name||'',price:p.salePrice||p.regularPrice||0,quantity:i.selectedQty||1});
          });
          if(items.length){
            _localCart=items;
            var pn=window.location.pathname;
            if(pn.indexOf('/checkout')!==-1&&pn.indexOf('order-success')===-1)pushBeginCheckout();
          }
          return;
        }

        /* Guest user product details: POST /api/product/get-products-by-ids */
        if(u.indexOf('get-products-by-ids')!==-1&&Array.isArray(d.data)){
          var lc=readLocalStorageCart();
          if(!lc.length)return;
          var prodMap={};
          d.data.forEach(function(p){if(p&&p._id)prodMap[String(p._id)]=p;});
          var items2=[];
          lc.forEach(function(i){
            var id=String(i.product||i.specialPackage||'');
            if(!id)return;
            var p=prodMap[id];
            items2.push({item_id:id,item_name:p?p.name||'':'',price:p?p.salePrice||p.regularPrice||0:0,quantity:i.selectedQty||1});
          });
          if(items2.length){
            _localCart=items2;
            var pn2=window.location.pathname;
            if(pn2.indexOf('/checkout')!==-1&&pn2.indexOf('order-success')===-1)pushBeginCheckout();
          }
          return;
        }

        /* Order placement: POST /api/order/add-order-by-user or add-order-by-anonymous */
        if(u.indexOf('add-order-by')!==-1&&d.data&&!_purchaseFired){
          _purchaseFired=true;
          var orderId=d.data.orderId||d.data._id||'';
          var successId=d.data._id||d.data.id||'';
          var items3=_localCart.slice();
          if(!items3.length){
            var lc2=readLocalStorageCart();
            items3=lc2.map(function(i){return{item_id:String(i.product||''),item_name:'',price:0,quantity:i.selectedQty||1};}).filter(function(i){return i.item_id;});
          }
          /* Get grandTotal and user data from request body */
          var grandTotal=0;
          var ud={country:'bd'};
          try{
            var req=JSON.parse(self._gbody||'{}');
            grandTotal=req.grandTotal||req.subTotal||cartVal(items3);
            if(req.phoneNo){
              var ph=String(req.phoneNo).replace(/\D/g,'');
              if(ph.length===11&&ph.charAt(0)==='0')ph='88'+ph;
              else if(ph.length===10)ph='880'+ph;
              ud.phone_number=ph;
            }
            if(req.name){
              var parts=req.name.trim().split(/\s+/);
              ud.first_name=parts[0].toLowerCase();
              ud.last_name=(parts.length>1?parts.slice(1).join(' '):parts[0]).toLowerCase();
            }
            if(req.email)ud.email_address=req.email.trim().toLowerCase();
            if(req.city)ud.city=req.city.trim().toLowerCase();
          }catch(e){grandTotal=cartVal(items3);}
          /* Add Facebook browser cookies for better match quality */
          var _fbc=_getCookie('_fbc');var _fbp=_getCookie('_fbp');
          if(_fbc)ud.fbc=_fbc;
          if(_fbp)ud.fbp=_fbp;
          var _x=_xid();if(_x)ud.external_id=_x;
          /* Store for NestJS CAPI injection */
          _lastOrderUserData=ud;
          _localCart=[];
          /* Store purchase payload — fire only when customer lands on thank-you page */
          try{sessionStorage.setItem('_pendingPurchase',JSON.stringify({event:'purchase_stape',ecommerce:{currency:'BDT',value:grandTotal,transaction_id:String(orderId),items:items3},user_data:ud,__stape:true}));}catch(e){}
          if(successId&&window.location.pathname.indexOf('/checkout')===0&&window.location.pathname.indexOf('order-success')===-1){
            setTimeout(function(){
              if(window.location.pathname.indexOf('/checkout')===0&&window.location.pathname.indexOf('order-success')===-1){
                window.location.href='/checkout/order-success/'+encodeURIComponent(successId);
              }
            },1200);
          }
        }
      }catch(e){}
    }
    self.addEventListener('load',handle);
    self.addEventListener('readystatechange',function(){if(self.readyState===4)handle();});
    return _xhrSend.apply(this,arguments);
  };

  /* ── Cart icon click → view_cart_stape ── */
  document.addEventListener('click',function(e){
    try{
      var el=e.target;
      for(var i=0;i<8;i++){
        if(!el||el===document)break;
        var cls=(el.className||'').toString();
        if(cls.indexOf('fa-shopping-bag')!==-1||cls.indexOf('cart-icon')!==-1||
           (el.getAttribute&&(el.getAttribute('aria-label')||'').toLowerCase().indexOf('cart')!==-1)){
          (function(){
            var fired=false;
            function tryVC(){
              if(fired)return;
              /* fire once _localCart is populated OR localStorage has items */
              if(_localCart.length||readLocalStorageCart().length){fired=true;pushViewCart();}
            }
            setTimeout(tryVC,300);
            setTimeout(tryVC,700);
            setTimeout(tryVC,1200);
          })();
          break;
        }
        el=el.parentElement;
      }
    }catch(e){}
  },true);

  /* ── Push page_view after Angular sets the document title ── */
  function pushPageView(forcedTitle){
    setTimeout(function(){
      try{
        var title=forcedTitle||document.title||'Amolbooks';
        var loc=window.location.href;
        var ref=document.referrer;
        if(typeof window.gtag==='function'){
          window.gtag('event','page_view',{page_location:loc,page_title:title,page_referrer:ref});
        } else {
          window.dataLayer.push({event:'page_view',page_location:loc,page_title:title,page_referrer:ref});
        }
      }catch(e){}
    },1500);
  }

  /* ── history.pushState: SPA nav ── */
  (function(){
    var _origPS=history.pushState;
    history.pushState=function(st,ti,url){
      try{_origPS.apply(this,arguments);}catch(e){}
      try{
        var u=String(url||'');
        if(u.indexOf('order-success')!==-1){
          _purchaseFired=false;
          document.title='Thank you Page - Amolbooks';
          var _pp=sessionStorage.getItem('_pendingPurchase');
          if(_pp){try{var _pd=JSON.parse(_pp);window.dataLayer.push({ecommerce:null});window.dataLayer.push(_pd);sessionStorage.removeItem('_pendingPurchase');}catch(e){}}
          pushPageView('Thank you Page - Amolbooks');
        } else if(u.indexOf('/checkout')!==-1){
          _checkoutFired=false;
          if(_localCart.length||readLocalStorageCart().length){pushBeginCheckout();}
          else{setTimeout(function(){pushBeginCheckout();},1500);}
        }
      }catch(e){}
    };
  })();

  /* ── DOMContentLoaded: hard-navigation to /checkout or /order-success ── */
  document.addEventListener('DOMContentLoaded',function(){
    var pn=window.location.pathname;
    if(pn.indexOf('order-success')!==-1){
      var _pp2=sessionStorage.getItem('_pendingPurchase');
      if(_pp2){try{var _pd2=JSON.parse(_pp2);window.dataLayer.push({ecommerce:null});window.dataLayer.push(_pd2);sessionStorage.removeItem('_pendingPurchase');}catch(e){}}
      pushPageView('Thank you Page - Amolbooks');
    } else if(pn.indexOf('/checkout')!==-1){
      var tries=0;
      var poll=setInterval(function(){
        tries++;
        pushBeginCheckout();
        if(_checkoutFired){clearInterval(poll);return;}
        if(tries>40)clearInterval(poll);
      },150);
    }
  });

})();
</script>
<script>
(function(){
  var _toastTimer=null;
  var _loopTimer=null;
  /* Buy-Now ("অর্ডার করুন") also POSTs add-to-cart then redirects to /checkout,
     so it fires the same add_to_cart event. Record Buy-Now clicks to suppress the
     toast for them — toast should show only for Add-to-Cart ("ক্রয় তালিকায় যুক্ত করুন"). */
  var _buyNowAt=0;
  document.addEventListener('click',function(e){
    var n=e.target;
    for(var i=0;i<6&&n&&n!==document.body;i++){
      if(n.tagName==='BUTTON'||n.tagName==='A'){
        if((n.textContent||'').replace(/\s+/g,' ').trim()==='অর্ডার করুন')_buyNowAt=Date.now();
        break;
      }
      n=n.parentElement;
    }
  },true);

  /* ── toast element (created once, lazily) ── */
  function getToast(){
    var t=document.getElementById('amol-cart-toast');
    if(!t){
      t=document.createElement('div');
      t.id='amol-cart-toast';
      t.innerHTML='<div class="amol-ct-msg">আপনার বই কার্টে যোগ হয়েছে।<br>অর্ডার সম্পন্ন করতে এখানে ক্লিক করুন</div>'
                 +'<button class="amol-ct-btn" onclick="window.location.href=\'/checkout\'">চেকআউট করুন &rarr;</button>';
      document.body.appendChild(t);
    }
    return t;
  }

  function showToast(){
    var t=getToast();
    clearTimeout(_toastTimer);
    t.classList.add('amol-show');
    _toastTimer=setTimeout(function(){t.classList.remove('amol-show');},6000);
  }

  /* ── loop animation helpers ── */
  function startCartLoop(){
    var icon=document.querySelector('.bottom-nav .fa-shopping-bag');
    if(!icon)return;
    icon.classList.remove('cart-icon-bounce','cart-icon-loop');
    void icon.offsetWidth;
    icon.classList.add('cart-icon-loop');
    clearTimeout(_loopTimer);
    /* auto-stop loop after 12 s so it doesn't run forever */
    _loopTimer=setTimeout(function(){
      if(icon)icon.classList.remove('cart-icon-loop');
    },12000);
  }

  function stopCartLoop(){
    var icon=document.querySelector('.bottom-nav .fa-shopping-bag');
    if(icon)icon.classList.remove('cart-icon-loop','cart-icon-bounce');
    clearTimeout(_loopTimer);
    /* also hide the toast */
    var t=document.getElementById('amol-cart-toast');
    if(t)t.classList.remove('amol-show');
    clearTimeout(_toastTimer);
  }

  function onCartAdded(){
    startCartLoop();
    if(Date.now()-_buyNowAt<2500)return;   // buy-now click: skip toast
    showToast();
  }

  /* ── listen for API add-to-cart (logged-in users) ── */
  window.addEventListener('amol-cart-added',onCartAdded);

  /* ── setup badge observer + cart-button click stopper ── */
  function setup(){
    var nav=document.querySelector('.bottom-nav');
    if(!nav){setTimeout(setup,600);return;}

    /* stop loop & toast when user taps the cart footer button */
    nav.addEventListener('click',function(e){
      var li=e.target;
      while(li&&li!==nav){
        if(li.tagName==='LI'&&li.querySelector('.fa-shopping-bag')){
          stopCartLoop();
          break;
        }
        li=li.parentElement;
      }
    });

    /* MutationObserver for guest/localStorage cart badge changes.
       Grace period: Angular renders existing cart count on page load —
       we track those changes silently for ~1.5 s, then arm the trigger. */
    var lastCount=0;
    var armed=false;
    var existingSmall=nav.querySelector('small');
    if(existingSmall)lastCount=parseInt((existingSmall.textContent||'').trim())||0;
    setTimeout(function(){armed=true;},1500);

    function findSmall(mut){
      var t=mut.target;
      /* characterData — text node inside <small> changed */
      if(t.tagName==='SMALL')return t;
      if(t.parentElement&&t.parentElement.tagName==='SMALL')return t.parentElement;
      /* childList — <small> element was added (first item ever added to cart) */
      if(mut.type==='childList'){
        for(var j=0;j<mut.addedNodes.length;j++){
          var node=mut.addedNodes[j];
          if(node.tagName==='SMALL')return node;
          if(node.nodeType===1&&node.querySelector){var s=node.querySelector('small');if(s)return s;}
        }
      }
      return null;
    }

    var obs=new MutationObserver(function(mutations){
      for(var i=0;i<mutations.length;i++){
        var small=findSmall(mutations[i]);
        if(small){
          var n=parseInt((small.textContent||'').trim())||0;
          if(armed&&n>lastCount){onCartAdded();}
          lastCount=n;
          break;
        }
      }
    });
    obs.observe(nav,{subtree:true,childList:true,characterData:true});
  }

  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',setup);}
  else{setup();}
})();
</script>
<script>
/* Global image-error fallback — covers NgOptimizedImage (ngSrc) which has
   no built-in error handler, as well as any other broken product images.
   Runs in capture phase so it fires before Angular's own listeners. */
(function(){
  var PLACEHOLDER='/assets/images/placeholder/test.png';
  document.addEventListener('error',function(e){
    var img=e.target;
    if(img.tagName!=='IMG')return;
    if(img._amolFallback)return;          /* already applied — stop loop */
    if(img.src&&img.src.indexOf(PLACEHOLDER)!==-1)return; /* already placeholder */
    img._amolFallback=true;
    img.removeAttribute('srcset');        /* clear srcset variants */
    img.removeAttribute('sizes');
    img.src=PLACEHOLDER;
  },true);
})();
</script>
<script>
(function () {
  'use strict';

  var DISTRICT_AREA_ENABLED = false; /* set true to re-enable */

  var _selectedDivision = null;
  var _selectedArea = null;
  var _districtsCache = null;
  var API_BASE = 'https://apisub.amolbooks.com/api';

  /* ── Save original fetch BEFORE patching ── */
  var _origFetch = window.fetch.bind(window);

  /* ── XHR interceptor ── */
  var _origOpen = XMLHttpRequest.prototype.open;
  var _origSend = XMLHttpRequest.prototype.send;

  XMLHttpRequest.prototype.open = function (method, url) {
    this._amol_method = method ? method.toUpperCase() : '';
    this._amol_url = typeof url === 'string' ? url : String(url || '');
    return _origOpen.apply(this, arguments);
  };

  XMLHttpRequest.prototype.send = function (body) {
    if (
      this._amol_method === 'POST' &&
      this._amol_url.indexOf('/order/add-order-by') !== -1 &&
      body &&
      (_selectedDivision || _selectedArea)
    ) {
      try {
        var p = JSON.parse(body);
        if (_selectedDivision) p.division = _selectedDivision;
        if (_selectedArea) p.area = _selectedArea;
        body = JSON.stringify(p);
      } catch (_) {}
    }
    return _origSend.call(this, body);
  };

  /* ── Fetch interceptor ── */
  window.fetch = function (url, opts) {
    var urlStr = typeof url === 'string' ? url : ((url && url.url) || '');
    if (
      opts && opts.method && opts.method.toUpperCase() === 'POST' &&
      urlStr.indexOf('/order/add-order-by') !== -1 &&
      opts.body &&
      (_selectedDivision || _selectedArea)
    ) {
      try {
        var p = JSON.parse(opts.body);
        if (_selectedDivision) p.division = _selectedDivision;
        if (_selectedArea) p.area = _selectedArea;
        opts = Object.assign({}, opts, { body: JSON.stringify(p) });
      } catch (_) {}
    }
    return _origFetch(url, opts);
  };

  /* ── API helpers (use saved _origFetch to avoid recursion) ── */
  function fetchDistricts() {
    return _origFetch(API_BASE + '/division/get-all', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filter: { status: 'publish' }, sort: { priority: 1 } })
    })
    .then(function (r) { return r.json(); })
    .then(function (json) {
      var data = (json && json.data) || [];
      return data.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
    })
    .catch(function () { return []; });
  }

  function fetchAreas(divisionId) {
    return _origFetch(API_BASE + '/area/get-all-by-parent/' + divisionId)
    .then(function (r) { return r.json(); })
    .then(function (json) {
      var data = (json && json.data) || [];
      return data.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
    })
    .catch(function () { return []; });
  }

  function ensureDistricts() {
    if (_districtsCache) return Promise.resolve(_districtsCache);
    return fetchDistricts().then(function (d) {
      _districtsCache = d;
      return d;
    });
  }

  /* ── HTML helpers ── */
  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── DOM injection ── */
  function injectDropdowns(districts) {
    if (document.getElementById('amol-addr-inject')) return;
    var ta = document.querySelectorAll('textarea.mat-mdc-form-field-textarea-control')[0];
    if (!ta) return;

    var anchor = ta;
    while (anchor && anchor.tagName.toLowerCase() !== 'mat-form-field' && anchor !== document.body) {
      anchor = anchor.parentElement;
    }
    if (!anchor || anchor === document.body) return;

    /* ── Custom searchable dropdown builder ── */
    function buildDD(ddId, phText, items, onSelect) {
      var wrap = document.createElement('div');
      wrap.className = 'amol-dd';
      wrap.id = ddId;

      var trigger = document.createElement('div');
      trigger.className = 'amol-dd-trigger';
      trigger.tabIndex = 0;
      trigger.innerHTML = '<span class="amol-dd-val">' + phText + '</span><span class="amol-dd-caret">&#8964;</span>';

      var panel = document.createElement('div');
      panel.className = 'amol-dd-panel';
      panel.style.display = 'none';
      panel.innerHTML =
        '<div class="amol-dd-sw"><span class="amol-dd-si">&#128269;</span><input class="amol-dd-inp" type="text" placeholder="অনুসন্ধান করুন..."></div>' +
        '<ul class="amol-dd-list"></ul>';

      wrap.appendChild(trigger);
      wrap.appendChild(panel);

      var valEl = trigger.querySelector('.amol-dd-val');
      var caretEl = trigger.querySelector('.amol-dd-caret');
      var inp = panel.querySelector('.amol-dd-inp');
      var list = panel.querySelector('.amol-dd-list');
      var isOpen = false;
      var _ph = phText;

      function renderItems(arr) {
        list.innerHTML = arr.map(function(it) {
          return '<li class="amol-dd-item" data-id="' + esc(it._id) + '" data-name="' + esc(it.name) + '">' + esc(it.name) + '</li>';
        }).join('');
      }

      renderItems(items);

      function openDD() {
        panel.style.display = 'block';
        isOpen = true;
        trigger.classList.add('amol-dd-open');
        inp.value = '';
        filterList('');
        setTimeout(function(){ inp.focus(); }, 10);
      }
      function closeDD() {
        panel.style.display = 'none';
        isOpen = false;
        trigger.classList.remove('amol-dd-open');
      }

      function filterList(q) {
        list.querySelectorAll('.amol-dd-item').forEach(function(li) {
          li.style.display = li.textContent.toLowerCase().indexOf(q.toLowerCase()) >= 0 ? '' : 'none';
        });
      }

      trigger.addEventListener('click', function(e) { e.stopPropagation(); isOpen ? closeDD() : openDD(); });
      inp.addEventListener('input', function() { filterList(this.value); });
      inp.addEventListener('click', function(e) { e.stopPropagation(); });
      list.addEventListener('click', function(e) {
        var li = e.target.closest('.amol-dd-item');
        if (!li) return;
        valEl.textContent = li.dataset.name;
        valEl.style.color = '#212121';
        closeDD();
        onSelect({ _id: li.dataset.id, name: li.dataset.name });
      });
      panel.addEventListener('click', function(e) { e.stopPropagation(); });
      document.addEventListener('click', function() { if (isOpen) closeDD(); });

      wrap.reset = function(newItems, newPh) {
        if (newPh) _ph = newPh;
        valEl.textContent = _ph;
        valEl.style.color = '';
        renderItems(newItems || []);
        closeDD();
      };

      return wrap;
    }

    var areaColEl;

    var distDD = buildDD('amol-district-dd', '-- জেলা নির্বাচন করুন --', districts, function(sel) {
      _selectedDivision = sel;
      _selectedArea = null;
      areaDD.reset([], '-- থানা নির্বাচন করুন --');
      areaColEl.style.cssText = 'flex:1;min-width:0;display:flex;flex-direction:column;opacity:0.5;pointer-events:none';
      fetchAreas(sel._id).then(function(areas) {
        areaDD.reset(areas, '-- থানা নির্বাচন করুন --');

<script>
/* Related-book Swiper: force 2 slides per view on mobile (<=768px).
   Swiper drives count via params.slidesPerView + breakpoints, so null the
   breakpoints and set 2, then update(). Reversible: set AB_HIDE.relatedSwiper2col=0. */
(function(){
  if(!(window.AB_HIDE&&window.AB_HIDE.relatedSwiper2col))return;
  function fix(){
    if(window.innerWidth>768)return;
    if(location.pathname.indexOf('/product-details/')===-1)return; // product page only — never homepage hero/category
    var els=document.querySelectorAll('.kids-book-main .swiper'); // related-book carousels only
    for(var i=0;i<els.length;i++){
      var sw=els[i].swiper;
      if(!sw||!sw.params)continue;
      if(sw.params.slidesPerView===2&&sw.params.slidesPerGroup===2)continue;
      try{
        sw.params.breakpoints=null;
        sw.params.slidesPerView=2;
        sw.params.slidesPerGroup=2;
        sw.update();
      }catch(e){}
    }
  }
  var t;
  function schedule(){clearTimeout(t);t=setTimeout(fix,150);}
  new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
  window.addEventListener('resize',schedule);
  document.addEventListener('DOMContentLoaded',fix);
  schedule();
})();
</script>

<script>
/* Homepage "Shop By Category": reorder categories so the one with the highest-selling
   book comes first, then next, etc. Order derived from /product/get-all sorted by
   totalSold desc (first appearance of each category name). Reversible: AB_HIDE.categorySortBySold=0. */
(function(){
  if(!(window.AB_HIDE&&window.AB_HIDE.categorySortBySold))return;
  var API='https://apisub.amolbooks.com/api/product/get-all';
  var _order=null,_fetching=false,_waiters=[];

  /* Hide the category slider until reordered, so the old order never flashes (FOUC). */
  var hideStyle=document.createElement('style');
  hideStyle.textContent='body:not(.ab-cat-ready) .shop-by-category .category-slider{visibility:hidden!important}';
  (document.head||document.documentElement).appendChild(hideStyle);
  var _revealed=false;
  function reveal(){ if(_revealed)return; _revealed=true; document.body.classList.add('ab-cat-ready'); }
  /* Safety: never leave the section hidden, even if API fails or swiper never appears. */
  setTimeout(reveal,3500);
  function fetchOrder(cb){
    if(_order)return cb(_order);
    _waiters.push(cb);
    if(_fetching)return; _fetching=true;
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pagination:{pageSize:300,currentPage:0},
        select:{category:1,totalSold:1},sort:{totalSold:-1}})})
      .then(function(r){return r.json();})
      .then(function(d){
        var list=(d&&d.data)||[],seen={},order=[];
        list.forEach(function(p){(p.category||[]).forEach(function(c){
          var n=c&&c.name; if(n&&!seen[n]){seen[n]=1;order.push(n);} });});
        _order=order; _waiters.forEach(function(w){try{w(order);}catch(e){}}); _waiters=[];
      }).catch(function(){_fetching=false;});
  }
  function norm(s){return (s||'').replace(/\s+/g,' ').trim();}
  function realSlides(wrap){
    return [].slice.call(wrap.children).filter(function(s){
      return (''+s.className).indexOf('swiper-slide')!==-1 && (''+s.className).indexOf('duplicate')===-1;});
  }
  var _done=false,_quietT=null,_obs=null,_findT=null;
  function doSort(){
    if(_done)return;
    var sw=document.querySelector('.category-swiper');
    if(!sw||!sw.swiper){schedulePoll();return;}
    var wrap=sw.querySelector('.swiper-wrapper');
    if(!wrap){schedulePoll();return;}
    _done=true;
    if(_obs){try{_obs.disconnect();}catch(e){}}
    fetchOrder(function(order){
      try{
        if(order&&order.length){
          var rank={}; order.forEach(function(n,i){rank[norm(n)]=i;});
          var sl=realSlides(wrap);
          if(sl.length>=2){
            sl.forEach(function(s,i){
              var h=s.querySelector('h1,h2,h3,h4');
              var k=h?rank[norm(h.textContent)]:undefined;
              s.__k=(k===undefined?1e6+i:k);        // unranked keep original order, after ranked
            });
            sl.sort(function(a,b){return a.__k-b.__k;});
            sl.forEach(function(s){wrap.appendChild(s);});
            try{sw.swiper.update();sw.swiper.slideTo(0,0);}catch(e){}
          }
        }
      }catch(e){}
      reveal();
    });
  }
  /* Sort only after the category slider has been DOM-quiet 900ms — i.e. Angular
     finished injecting every category AND its products. Sorting mid-injection
     detaches half-built slides and empties them. */
  function quiet(){clearTimeout(_quietT);_quietT=setTimeout(doSort,900);}
  function schedulePoll(){clearTimeout(_findT);_findT=setTimeout(attach,250);}
  function attach(){
    if(_done)return;
    var sw=document.querySelector('.category-swiper');
    if(!sw){schedulePoll();return;}
    if(!_obs){_obs=new MutationObserver(quiet);_obs.observe(sw,{childList:true,subtree:true});}
    quiet();
  }
  fetchOrder(function(){});                          // prefetch order ASAP
  setTimeout(reveal,5000);                           // safety: never stay hidden
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',attach); else attach();
})();
</script>

<script>
(function(){
  var TAG_ID='69a3b7f20d6f5e6e2633656c';
  var API='https://apisub.amolbooks.com/api/product/get-all';
  var TAG_API='https://apisub.amolbooks.com/api/tag/get-all-data';
  var SECTION_ID='__shudhui-section';
  var _cache=null;
  var _lastPath='';
  var _tagName='শুধুই আপনার জন্য';

  /* Inject responsive grid styles once */
  if(!document.querySelector('style[data-shudhui-style]')){

    _s.textContent='.__shudhui-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}.__shudhui-grid a img{height:160px;object-fit:cover;width:100%;display:block;}@media(min-width:600px){.__shudhui-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}.__shudhui-grid a img{height:210px;}}';
    document.head.appendChild(_s);
  }

  function fetchTagName(){
    fetch(TAG_API).then(function(r){return r.json();}).then(function(d){
      if(d.success&&d.data&&d.data.length){
        var found=d.data.find(function(t){return t._id===TAG_ID||String(t._id)===TAG_ID;});
        if(found&&found.name)_tagName=found.name;
      }
    }).catch(function(){});
  }

  function fetchProducts(cb){
    if(_cache){return cb(_cache);}
    fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        filter:{'tags._id':TAG_ID},
        pagination:{pageSize:20,currentPage:0},
        select:{name:1,slug:1,images:1,salePrice:1,afterDiscountPrice:1,discount:1,author:1}
      })
    }).then(function(r){return r.json();}).then(function(d){
      if(d.success&&d.data&&d.data.length){_cache=d.data;cb(d.data);}
    }).catch(function(){});
  }

  function buildSection(products){
    var cards=products.map(function(p){
      var img=(p.images&&p.images.length)?p.images[0]:'/assets/images/logo/logo.png';
      var name=p.name||'';
      var slug=p.slug||'';
      /* author may be string, object {name}, or array of those */
      var author='';
      if(p.author){
        if(typeof p.author==='string')author=p.author;
        else if(Array.isArray(p.author))author=p.author.map(function(a){return typeof a==='string'?a:(a&&a.name?a.name:'');}).filter(Boolean).join(', ');
        else if(p.author.name)author=p.author.name;
      }
      /* salePrice = marked/list price; afterDiscountPrice = final customer price */
      var saleP=p.salePrice||0;
      var finalP=p.afterDiscountPrice||saleP;
      var disc=p.discount||0;
      var discBadgeVal=disc||(saleP&&finalP&&saleP>finalP?Math.round((saleP-finalP)/saleP*100):0);
      var priceHtml=finalP
        ?'<span style="font-size:15px;font-weight:700;color:#e53935;font-family:hind-siliguri,sans-serif;">৳'+finalP+'</span>'
         +(saleP&&saleP>finalP?'<span style="font-size:12px;color:#999;text-decoration:line-through;margin-left:6px;font-family:hind-siliguri,sans-serif;">৳'+saleP+'</span>':'')
        :'';
      var discBadge=discBadgeVal?'<span style="position:absolute;top:8px;right:8px;background:#e53935;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:20px;line-height:1;">'+discBadgeVal+'%</span>':'';
      return '<a href="/product-details/'+slug+'"'
        +' style="display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee;box-shadow:0 2px 6px rgba(0,0,0,.07);"'

        +'<div style="position:relative;overflow:hidden;background:#f5f5f5;">'

        +discBadge
        +'</div>'
        +'<div style="padding:10px 12px 14px;flex:1;display:flex;flex-direction:column;gap:4px;">'
        +'<div style="font-size:13.5px;font-family:hind-siliguri,sans-serif;color:#1a1a1a;line-height:1.5;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;">'+name+'</div>'
        +(author?'<div style="font-size:12px;color:#777;font-family:hind-siliguri,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+author+'</div>':'')
        +(priceHtml?'<div style="margin-top:4px;display:flex;align-items:baseline;gap:4px;">'+priceHtml+'</div>':'')
        +'</div>'
        +'</a>';
    }).join('');

    return '<section id="'+SECTION_ID+'" style="background:#fff;padding:44px 0 52px;margin-top:0;">'
      +'<div style="max-width:1320px;margin:0 auto;padding:0 20px;box-sizing:border-box;">'
      +'<h2 style="font-family:hind-siliguri,sans-serif;font-size:24px;font-weight:700;color:#2e7d32;text-align:center;margin:0 0 28px 0;">'+_tagName+'</h2>'
      +'<div class="__shudhui-grid">'
      +cards
      +'</div>'
      +'</div>'
      +'</section>';
  }

  function inject(products){
    if(document.getElementById(SECTION_ID))return;
    // Try known product-detail container selectors
    var selectors=['.product-details','app-product-details','.product-main','.product-wrapper','.single-product','.pd-main','main','app-root'];
    var target=null;
    for(var i=0;i<selectors.length;i++){
      var el=document.querySelector(selectors[i]);
      if(el&&el.children.length>0){target=el;break;}
    }

    var div=document.createElement('div');
    div.innerHTML=buildSection(products);
    target.appendChild(div.firstElementChild);

  function tryInject(){
    if(document.getElementById(SECTION_ID))return;
    fetchProducts(function(products){inject(products);});

  function onNavigate(){
    var path=window.location.pathname;
    if(path===_lastPath)return;

    var old=document.getElementById(SECTION_ID);
    if(old)old.parentNode.removeChild(old);
    if(path.indexOf('/product-details/')===0){

      setTimeout(tryInject,2500);

  }

  var _origPS=history.pushState;
  history.pushState=function(){
    _origPS.apply(this,arguments);

  };
  var _origRS=history.replaceState;
  history.replaceState=function(){
    _origRS.apply(this,arguments);
    setTimeout(onNavigate,0);

    fetchTagName();

    onNavigate();
  });
})();

<script>
/* Remove the placeholder banner image that appears below product descriptions. */
(function(){
  'use strict';
  function removeProductDescriptionDummyBanner(){
    if(window.location.pathname.indexOf('/product-details/') !== 0) return;
    document.querySelectorAll('.banner .banner-main img').forEach(function(img){
      var src = img.currentSrc || img.src || img.getAttribute('src') || '';
      if(src.indexOf('/assets/images/jpg/dummy-image.jpg') === -1) return;
      var banner = img.closest('.banner');
      if(banner) banner.remove();
    });
  }

  function schedule(){
    removeProductDescriptionDummyBanner();
    setTimeout(removeProductDescriptionDummyBanner, 300);
    setTimeout(removeProductDescriptionDummyBanner, 1000);
    setTimeout(removeProductDescriptionDummyBanner, 2500);
  }

  var pushState = history.pushState;
  history.pushState = function(){
    var result = pushState.apply(this, arguments);
    schedule();
    return result;
  };
  window.addEventListener('popstate', schedule);
  document.addEventListener('DOMContentLoaded', function(){
    schedule();
    try {
      new MutationObserver(removeProductDescriptionDummyBanner).observe(document.body, {
        childList: true,
        subtree: true
      });
    } catch(e) {}
  });
})();
</script>

<script>
/* Custom Nav Rewrite — replaces navbar with preferred menu */
(function(){
  'use strict';

  var MENU=[
    {text:'হোমপেজ', homeKey:'মূলপাতা'},
    {text:'অফার',   srcKey:'অফার'},
    {text:'সকল বই', srcKey:'সকল বই'},
    {text:'কোরআন',  href:'/product-list?categories=%E0%A6%95%E0%A7%81%E0%A6%B0%E0%A6%86%E0%A6%A8-%E0%A6%B6%E0%A7%87%E0%A6%96%E0%A6%BE'},
    {text:'সিরাত',  href:'/product-list?categories=%E0%A6%B8%E0%A7%80%E0%A6%B0%E0%A6%BE%E0%A6%A4%E0%A7%87-%E0%A6%B0%E0%A6%BE%E0%A6%B8%E0%A7%82%E0%A6%B2-(%E0%A6%B8%E0%A6%BE.)'},
    {text:'হাদিস',  href:'/product-list?tags=besthadisbooks'},
  ];

  function normUrl(s){try{return decodeURIComponent(s);}catch(e){return s;}}

  function isActive(href){
    var p=normUrl(window.location.pathname+window.location.search);
    var h=normUrl(href);
    if(h==='/'||h==='')return p==='/'||p==='';
    if(h.indexOf('?')!==-1)return p===h;
    return p===h||p.indexOf(h+'/')=== 0||p.indexOf(h+'?')===0;
  }

  function cleanCls(c){return(c||'').replace(/\b(active|router-link-active|router-link-exact-active)\b/g,'').replace(/\s+/g,' ').trim();}

  function ngAttrOf(el){
    for(var i=0;i<el.attributes.length;i++)
      if(el.attributes[i].name.indexOf('_ngcontent')===0)return el.attributes[i].name;
    return null;
  }

  function rewriteNav(){
    var header=document.querySelector('app-header');
    if(!header)return false;
    if(header.querySelector('[data-amol-nav="1"]'))return true;

    /* find any existing nav anchor to locate container */
    var anchors=header.querySelectorAll('a');
    var sampleA=null;
    for(var i=0;i<anchors.length;i++){
      var t=(anchors[i].textContent||'').trim();
      if(t==='মূলপাতা'||t==='সকল বই'||t==='ব্লগ'){sampleA=anchors[i];break;}
    }
    if(!sampleA)return false;

    /* walk up to find the list container */
    var navEl=null;
    var p=sampleA.parentElement;
    while(p&&p!==header){
      if((p.tagName==='UL'||p.tagName==='NAV')&&p.children.length>=3){navEl=p;break;}
      p=p.parentElement;
    }
    if(!navEl){
      /* fallback: look for a div sibling container */
      p=sampleA.parentElement;
      while(p&&p!==header){
        if(p.children.length>=4&&p.querySelectorAll('a').length>=4){navEl=p;break;}
        p=p.parentElement;
      }
    }
    if(!navEl)return false;

    /* collect existing hrefs */
    var hrefs={};
    anchors.forEach(function(a){hrefs[(a.textContent||'').trim()]=a.getAttribute('href')||'/';});

    var useLi=sampleA.parentElement&&sampleA.parentElement.tagName==='LI';
    var sampleLi=useLi?sampleA.parentElement:null;
    var aClass=cleanCls(sampleA.className);
    var liClass=sampleLi?cleanCls(sampleLi.className):'';
    var aNg=ngAttrOf(sampleA);
    var liNg=sampleLi?ngAttrOf(sampleLi):null;

    navEl.innerHTML='';
    MENU.forEach(function(item){
      var href=item.href||(item.homeKey?hrefs[item.homeKey]||'/':hrefs[item.srcKey]||'/');
      var active=isActive(href);

      var a=document.createElement('a');
      a.className=active?(aClass+' active').trim():aClass;
      a.setAttribute('href',href);
      a.textContent=item.text;
      if(aNg)a.setAttribute(aNg,'');

      if(useLi){
        var li=document.createElement('li');
        li.className=active?(liClass+' active').trim():liClass;
        if(liNg)li.setAttribute(liNg,'');
        li.appendChild(a);
        navEl.appendChild(li);
      } else {
        navEl.appendChild(a);
      }
    });
    navEl.setAttribute('data-amol-nav','1');
    return true;
  }

  function updateActive(){
    var nav=document.querySelector('[data-amol-nav]');
    if(!nav)return;
    nav.querySelectorAll('a').forEach(function(a){
      var active=isActive(a.getAttribute('href')||'');
      a.classList.toggle('active',active);
      if(a.parentElement&&a.parentElement.tagName==='LI')
        a.parentElement.classList.toggle('active',active);
    });
  }

  var _navObs=null;
  function setup(n){
    var header=document.querySelector('app-header');
    if(!header){if(n>0)setTimeout(function(){setup(n-1);},300);return;}
    rewriteNav();
    if(_navObs)return;
    _navObs=new MutationObserver(function(){
      if(!header.querySelector('[data-amol-nav="1"]'))setTimeout(rewriteNav,30);
    });
    _navObs.observe(header,{childList:true,subtree:true});
  }

  var _oPS=history.pushState;
  history.pushState=function(){_oPS.apply(this,arguments);setTimeout(updateActive,150);};
  window.addEventListener('popstate',function(){setTimeout(updateActive,50);});
  document.addEventListener('DOMContentLoaded',function(){setTimeout(function(){setup(20);},400);});
})();
</script>

<script>
/* OFF50 Promo Banner — header strip + checkout hint + auto-apply chip + congrats toast */
(function(){

  var BANNER_ID='__off50-promo-banner';

      +'#__off50-promo-banner .off50-timer .off50-cd{font-weight:700;color:#78350F;font-variant-numeric:tabular-nums;letter-spacing:0.03em;}'

      +'#__off50-promo-banner .off50-close{background:none;border:none;cursor:pointer;color:#78350F;font-size:18px;padding:0 4px;line-height:1;opacity:0.6;}'
      +'#__off50-promo-banner .off50-close:hover{opacity:1;}'
      +'@media(max-width:480px){#__off50-promo-banner{padding:8px 12px;}}';
    document.head.appendChild(s);
  }

  /* ── countdown timer ── */
  var EXPIRY_MS=new Date('2026-05-31T23:59:59+06:00').getTime();
  var _timerInterval=null;

  function fmtCountdown(){
    var rem=Math.max(0,EXPIRY_MS-Date.now());
    var s=Math.floor(rem/1000);
    var d=Math.floor(s/86400); s-=d*86400;
    var h=Math.floor(s/3600); s-=h*3600;
    var m=Math.floor(s/60); s-=m*60;
    var parts=[];
    if(d>0)parts.push(d+'d');
    parts.push((h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s);
    return parts.join(' ');
  }

  function startTimer(){
    if(_timerInterval)return;
    _timerInterval=setInterval(function(){
      var el=document.querySelector('#__off50-promo-banner .off50-cd');
      if(!el){clearInterval(_timerInterval);_timerInterval=null;return;}
      var rem=EXPIRY_MS-Date.now();
      if(rem<=0){
        el.textContent='শেষ হয়ে গেছে';
        clearInterval(_timerInterval);_timerInterval=null;
        return;
      }
      el.textContent=fmtCountdown();
    },1000);
  }

  /* ── header banner ── */
  function isDismissed(){try{return sessionStorage.getItem(DISMISSED_KEY)==='1';}catch(e){return false;}}

  function injectHeaderBanner(){
    if(document.getElementById(BANNER_ID))return;
    if(isDismissed())return;
    var header=document.querySelector('app-header');
    if(!header||!header.parentElement)return;
    injectStyles();
    var b=document.createElement('div');
    b.id=BANNER_ID;
    b.innerHTML='<div class="off50-inner">'
      +'<div class="off50-left">'
      +'<div class="off50-msg"><span style="font-size:15px;flex-shrink:0;">🏷️</span><span></span></div>'
      +'<div class="off50-timer">⏰ অফার শেষ হবে: <span class="off50-cd">'+fmtCountdown()+'</span></div>'
      +'</div>'
      +'<div class="off50-right"><span class="off50-pill">OFF50</span>'
      +'<button class="off50-close" aria-label="বন্ধ করুন">&times;</button></div>'
      +'</div>';
    b.querySelector('.off50-close').addEventListener('click',function(){
      b.style.display='none';
      try{sessionStorage.setItem(DISMISSED_KEY,'1');}catch(e){}
      if(_timerInterval){clearInterval(_timerInterval);_timerInterval=null;}
    });
    header.parentElement.insertBefore(b,header.nextSibling);
    startTimer();
  }

	  function tryBanner(n){
	    return;
	  }

  /* ── checkout hint ── */
  function bengaliToNum(s){
    return s.replace(/[৳\s,]/g,'').replace(/[০-৯]/g,function(c){return ''+(c.charCodeAt(0)-0x09E6);});
  }

  function readSubtotal(){
    try{
      var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null,false);
      var node;
      while((node=walker.nextNode())){
        if((node.nodeValue||'').trim()==='মোট টাকা'){
          var row=node.parentElement&&node.parentElement.parentElement;
          if(!row)continue;
          var children=row.querySelectorAll('*');
          for(var i=0;i<children.length;i++){
            var t=(children[i].textContent||'').trim();
            if(t.indexOf('মোট টাকা')!==-1)continue;
            var n2=parseInt(bengaliToNum(t));
            if(!isNaN(n2)&&n2>100&&n2<100000)return n2;
          }
        }
      }
    }catch(e){}
    return null;
  }

	  function injectCheckoutHint(){
	    return;
	    if(document.getElementById(CHECKOUT_HINT_ID))return;
    if(window.location.pathname.indexOf('/checkout')===-1)return;
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null,false);
    var node;
    var target=null;
    while((node=walker.nextNode())){
      if((node.nodeValue||'').indexOf('প্রোমো কোড বা ভাউচার কোড')!==-1||(node.nodeValue||'').indexOf('Add Promo code or voucher')!==-1){
        target=node.parentElement;
        break;
      }
    }
    if(!target||!target.parentElement)return;
    var total=readSubtotal();
    var qualifies=(total===null||total>=860);
    var bg=qualifies?'#EAF3DE':'#FAEEDA';
    var bd=qualifies?'#97C459':'#E8B77A';
    var tc=qualifies?'#27500A':'#854F0B';
    var pb=qualifies?'#27500A':'#854F0B';
    var pt=qualifies?'#C0DD97':'#FFF3E0';
    var line2=qualifies
      ?'৫০ টাকা ছাড় পাবেন'
      :(total!==null
        ?'আর ৳'+(860-total)+' টাকার বই যোগ করুন এবং OFF50 ব্যবহার করুন'
        :'৫০ টাকা ছাড় পাবেন');
    var hint=document.createElement('div');
    hint.id=CHECKOUT_HINT_ID;
    hint.style.cssText='background:'+bg+';border:0.5px solid '+bd+';border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:hind-siliguri,sans-serif;box-sizing:border-box;';
    hint.innerHTML='<div style="display:flex;align-items:center;gap:8px;flex:1;">'
      +'<span style="font-size:15px;flex-shrink:0;">🏷️</span>'
      +'<div style="display:flex;flex-direction:column;gap:1px;">'
      +'<span style="color:'+tc+';font-size:12px;font-weight:400;">৮৬০ টাকার উপর অর্ডারে</span>'
      +'<span style="color:'+tc+';font-size:13px;font-weight:600;">'+line2+'</span>'
      +'</div></div>'
      +'<span style="background:'+pb+';color:'+pt+';font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;letter-spacing:0.05em;flex-shrink:0;cursor:pointer;user-select:all;">OFF50</span>';
    target.parentElement.insertBefore(hint,target);
    injectAutoApply();
    watchCouponApply();
  }

  /* ── auto-apply chip (above input) ── */
  function injectAutoApply(){
    if(document.getElementById(AUTOAPPLY_ID))return;
    var inputs=document.querySelectorAll('input');
    var inp=null;
    for(var i=0;i<inputs.length;i++){
      var ph=(inputs[i].placeholder||'');
      if(ph.indexOf('কুপন কোড')!==-1||ph.indexOf('আপনার কুপন')!==-1||ph.indexOf('oupon')!==-1){inp=inputs[i];break;}
    }
    if(!inp)return;
    var chip=document.createElement('div');
    chip.id=AUTOAPPLY_ID;
    chip.style.cssText='margin-bottom:8px;font-family:hind-siliguri,sans-serif;';
    chip.innerHTML='<button style="display:inline-flex;align-items:center;gap:8px;background:#EAF3DE;color:#27500A;border:1px solid #97C459;border-radius:8px;padding:8px 14px;font-size:13px;font-family:hind-siliguri,sans-serif;font-weight:600;cursor:pointer;width:100%;box-sizing:border-box;justify-content:center;">'
      +'<span style="background:#27500A;color:#C0DD97;border-radius:4px;padding:2px 8px;font-size:11px;letter-spacing:0.05em;font-weight:700;">OFF50</span>'
      +'Use Coupon OFF50'
      +'</button>';
    chip.querySelector('button').addEventListener('click',function(){
      inp.value='OFF50';
      inp.dispatchEvent(new Event('input',{bubbles:true}));
      inp.dispatchEvent(new Event('change',{bubbles:true}));
      var btns=document.querySelectorAll('button');
      for(var i=0;i<btns.length;i++){
        var t=(btns[i].textContent||'').trim();
        if(t==='অ্যাপ্লাই'||t.toLowerCase()==='apply'){btns[i].click();break;}
      }
    });
    var par=inp.closest('mat-form-field')||inp.parentElement;
    if(par)par.insertAdjacentElement('beforebegin',chip);
  }

  /* ── congrats toast ── */
  function showCongratsToast(){
    var old=document.getElementById(TOAST_ID);
    if(old)old.remove();
    var t=document.createElement('div');
    t.id=TOAST_ID;
    t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(40px);background:#27500A;color:#EAF3DE;border-radius:16px;padding:18px 24px 16px;max-width:92vw;min-width:280px;box-shadow:0 8px 28px rgba(0,0,0,0.4);z-index:999999;opacity:0;transition:opacity 0.35s ease,transform 0.35s ease;text-align:center;font-family:hind-siliguri,sans-serif;';
    t.innerHTML='<div style="font-size:26px;margin-bottom:8px;">🎉</div>'
      +'<div style="font-size:15px;font-weight:700;margin-bottom:4px;">Congratulations!</div>'
      +'<div style="font-size:14px;font-weight:400;line-height:1.5;">আপনি ৫০ টাকা ডিসকাউণ্ট পেয়েছেন</div>';
    document.body.appendChild(t);
    requestAnimationFrame(function(){
      t.style.opacity='1';
      t.style.transform='translateX(-50%) translateY(0)';
    });
    setTimeout(function(){
      t.style.opacity='0';
      t.style.transform='translateX(-50%) translateY(40px)';
      setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},400);
    },4500);
  }

  /* ── watch for coupon success ── */
  function watchCouponApply(){
    var _armed=false;
    var _shown=false;

    function arm(){_armed=true;}

    /* Capture Apply button click when OFF50 is in the input */
    document.addEventListener('click',function(e){
      if(_shown)return;
      var el=e.target;
      for(var up=0;up<6;up++){
        if(!el||el===document)break;
        var t=(el.textContent||'').trim();
        if(el.tagName==='BUTTON'&&(t==='অ্যাপ্লাই'||t.toLowerCase()==='apply')){
          var inp=document.querySelector('input[placeholder*="কুপন"], input[placeholder*="oupon"]');
          if(inp&&(inp.value||'').toUpperCase()==='OFF50'){arm();}
          break;
        }
        el=el.parentElement;
      }
    },true);

    /* DOM observer: fires when Angular updates summary or shows snackbar */
    var obs=new MutationObserver(function(muts){
      if(!_armed||_shown)return;
      for(var i=0;i<muts.length;i++){
        var target=muts[i].target;
        /* snackbar appeared */
        if(document.querySelector('.mat-mdc-snack-bar-container,.mat-snack-bar-container,app-snackbar-notification')){
          _shown=true;obs.disconnect();
          setTimeout(showCongratsToast,400);
          return;
        }
        /* coupon/discount text appeared in DOM */
        var txt=(target.textContent||'');
        if(txt.indexOf('OFF50')!==-1||txt.indexOf('off50')!==-1||txt.indexOf('কুপন ছাড়')!==-1||txt.indexOf('Coupon Discount')!==-1){
          _shown=true;obs.disconnect();
          setTimeout(showCongratsToast,300);
          return;
        }
      }
    });
    obs.observe(document.body,{subtree:true,childList:true,characterData:true});
    /* Disconnect after 10 s to avoid leak */
    setTimeout(function(){obs.disconnect();},10000);
  }

  function tryCheckout(n){
    if(window.location.pathname.indexOf('/checkout')===-1)return;
    injectCheckoutHint();
    if(!document.getElementById(CHECKOUT_HINT_ID)&&n>0)setTimeout(function(){tryCheckout(n-1);},500);
  }

  /* ── SPA navigation hooks ── */
  var _origPS=history.pushState;
  history.pushState=function(st,ti,url){
    _origPS.apply(this,arguments);
    setTimeout(function(){
      var u=String(url||'');
      var o1=document.getElementById(CHECKOUT_HINT_ID);if(o1)o1.remove();
      var o2=document.getElementById(AUTOAPPLY_ID);if(o2)o2.remove();
      var o3=document.getElementById(TOAST_ID);if(o3)o3.remove();
      setTimeout(function(){tryBanner(5);},300);
      if(u.indexOf('/checkout')!==-1)setTimeout(function(){tryCheckout(8);},500);
    },0);

<!-- Google Ads Purchase Conversion Tracking -->
<script>
(function(){
  'use strict';
  // Fire once per order. transaction_id deduplicates in Google Ads.
  var _firedTx = null;

  function fireConversion(value, txId) {
    if(_firedTx && _firedTx === String(txId)) return; // already fired for this order
    if(typeof gtag !== 'function') return;
    _firedTx = String(txId);
    gtag('event', 'conversion', {
      'send_to': 'AW-18176858056/HpNqCMmNn7AcEMivs9tD',
      'value': Number(value) || 0,
      'currency': 'BDT',
      'transaction_id': String(txId || '')
    });
  }

  // XHR intercept: detect successful order POST, extract value + transaction_id
  var _xo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(m, url) {
    this._convUrl = typeof url === 'string' ? url : '';
    this._convMethod = (m || '').toUpperCase();
    return _xo.apply(this, arguments);
  };
  var _xs = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function(body) {
    var xhr = this;
    xhr.addEventListener('load', function() {
      var u = xhr._convUrl || '';
      var m = xhr._convMethod || '';
      // POST to any /order or /checkout endpoint with 2xx response
      if(m === 'POST' && xhr.status >= 200 && xhr.status < 300 &&
         (u.indexOf('/order') !== -1 || u.indexOf('/checkout') !== -1)) {
        try {
          var d = JSON.parse(xhr.responseText);
          // Extract order value and ID from common response shapes
          var dd = d.data || d.order || d;
          var value = dd.totalAmount || dd.grandTotal || dd.total || dd.amount || dd.payableAmount || 0;
          var txId = dd._id || dd.id || dd.orderId || dd.order_id || d._id || d.id || '';
          if(txId) fireConversion(value, txId);
        } catch(e) {}
      }
    });
    return _xs.apply(this, arguments);
  };

  // Also fire on SPA navigation to known success URL patterns (fallback)
  function checkSuccessUrl() {
    var p = window.location.pathname;
    if(p.indexOf('success') !== -1 || p.indexOf('confirm') !== -1 || p.indexOf('thank') !== -1) {
      // Only fire if not already fired for this session
      if(!_firedTx) fireConversion(0, 'url-trigger-' + Date.now());
    }
  }

  // Reset fired state on new navigation (new order flow)
  var _ps = history.pushState;
  history.pushState = function() {
    _ps.apply(this, arguments);
    setTimeout(checkSuccessUrl, 400);
  };
  window.addEventListener('popstate', function() { setTimeout(checkSuccessUrl, 400); });
  document.addEventListener('DOMContentLoaded', checkSuccessUrl);
})();
</script>

      var dec=document.createElement('button');dec.type='button';dec.textContent='−';
      var inc=document.createElement('button');inc.type='button';inc.textContent='+';
      box.appendChild(dec);box.appendChild(inc);
      wrap.appendChild(box);
      if(db.del){
        var rm=document.createElement('button');rm.type='button';rm.className='ab-codel';rm.title='সরিয়ে ফেলুন';
        rm.innerHTML='<i class="fa fa-trash-alt"></i>';
        rm.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var d=drawerButtons(name);if(d&&d.del)d.del.click();});
        wrap.appendChild(rm);
      }
      anchor.appendChild(wrap);
      dec.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var d=drawerButtons(name);if(d&&d.minus)d.minus.click();});
      inc.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var d=drawerButtons(name);if(d&&d.plus)d.plus.click();});
    });
  }
  var mo=new MutationObserver(function(){build();});
  mo.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',build);
  build();
})();
</script>

<script>
/* Checkout item-list: free-notebook progress bar + earned-gift row + "buy more
   books" CTA, inside the "মোট আইটেম" panel. Threshold/product data pulled live
   from GET /api/order-offer/get so the on-page promise always matches what
   evaluateGiftLine() actually attaches server-side (order.service.ts) — see
   [[project_salesboost_widgets]]. Guest total uses salePrice*qty from the
   localStorage cart (same formula the backend uses); logged-in carts are
   server-side (no localStorage) so total is parsed from the rendered rows.
   New nodes are inserted as SIBLINGS of the Angular *ngFor row list — never as
   children of it — so Angular re-rendering the list can't wipe them (same safe
   pattern as the checkout-gift lever). Quantity changes still go through the
   existing guest stepper above (edit + reload): the order summary's delivery
   fee/coupon math is real Angular state, so faking it client-side risks a
   displayed price that doesn't match the submitted order. This block just
   re-renders fresh after that reload, with the bar animating via CSS
   transition, which reads as dynamic without that risk. */
(function(){
  'use strict';

  var API_BASE = 'https://apisub.amolbooks.com/api';
  var PROGRESS_ID = 'ab-co-progress';
  var GIFT_ID = 'ab-co-giftrow';
  var MORE_ID = 'ab-co-more';
  var cfgCache = null, cfgPending = false;

  function onCheckout(){ var p=location.pathname; return p.indexOf('/checkout')===0 && p.indexOf('order-success')===-1; }

  function toBn(n){ var m=['০','১','২','৩','৪','৫','৬','৭','৮','৯']; return String(n).replace(/\d/g,function(d){return m[d];}); }
  function bnToNum(s){ var m={'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'}; return String(s).replace(/[০-৯]/g,function(d){return m[d];}); }

  // Guest cart in localStorage is only {product:<id>, selectedQty} — no price
  // or slug — so total is always read from the rendered rows, which Angular
  // has already resolved to real sale prices (works for guest AND logged-in
  // alike). The row-list also renders a second, hidden, off-screen copy
  // elsewhere in the DOM (confirmed live) — must filter to visible only or
  // totals double-count.
  function rows(){
    return [].filter.call(document.querySelectorAll('.cart-product-item'), function(r){ return r.offsetParent!==null; });
  }
  // .current-price is the row's LINE TOTAL (unit price already multiplied by
  // qty by Angular) — confirmed live: qty 2->1 took ৳২০৪ to ৳১০২, an exact
  // halving. Do NOT multiply by qty again here — that was the original bug,
  // squaring the quantity factor and showing a remaining-amount that didn't
  // match the real Checkout Summary subtotal.
  function rowLineTotal(row){
    var el = row.querySelector('.cart-product-price .current-price');
    var t = el ? el.textContent : '';
    // Strip thousands-separator commas first — ৳১,২০০ would otherwise parse
    // as just "1" (regex stops at the comma), silently truncating any price
    // over 999.
    var m = bnToNum(t).replace(/,/g,'').match(/\d+/);
    return m ? parseInt(m[0],10) : 0;
  }
  function domTotal(){
    var r = rows(), sum = 0;
    for (var i=0;i<r.length;i++) sum += rowLineTotal(r[i]);
    return sum;
  }
  // Buy-X-of-a-specific-book trigger needs the product slug, which isn't
  // available client-side (see above) — only the amount threshold is checked
  // here. evaluateGiftLine() on the server still honors the buy-X rule
  // regardless; this widget just won't show its confirmation row for that
  // specific case.
  function cartState(){
    return { total: domTotal() };
  }

  function styleOnce(){
    if (document.getElementById('ab-co-style')) return;
    var s = document.createElement('style'); s.id = 'ab-co-style';
    s.textContent =
      '#'+PROGRESS_ID+'{margin:10px 0;margin-left:10px;margin-right:10px;padding:12px 14px;border-radius:13px;box-sizing:border-box;'+
        'font-family:hind-siliguri,sans-serif;background:linear-gradient(135deg,#1f8354,#2ea86a);color:#fff}'+
      '#'+PROGRESS_ID+' .row{display:flex;align-items:center;gap:11px}'+
      '#'+PROGRESS_ID+' .nb{width:40px;height:50px;border-radius:6px;object-fit:cover;background:#fff;flex:0 0 auto}'+
      '#'+PROGRESS_ID+' .t{flex:1;min-width:0}'+
      '#'+PROGRESS_ID+' .h{font-size:13px;font-weight:700;line-height:1.5}'+
      '#'+PROGRESS_ID+' .h b{color:#f4d44e}'+
      '#'+PROGRESS_ID+' .bar{margin-top:8px;height:9px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}'+
      '#'+PROGRESS_ID+' .fill{height:100%;background:#f4d44e;width:0;transition:width .6s ease}'+
      // Matches .cart-product-item exactly: its real parent (.cart-products-list)
      // has padding:15px that this row — a sibling OUTSIDE that list on purpose,
      // so Angular re-rendering the list can't wipe it — never inherits, so the
      // same 15px is added directly here, plus the same 80x80 image and 15px gap.
      '#'+GIFT_ID+'{display:flex;align-items:flex-start;gap:15px;padding:14px 15px 0 15px;margin-top:14px;'+
        'border-top:1px solid #eee;font-family:hind-siliguri,sans-serif;box-sizing:border-box}'+
      '#'+GIFT_ID+' img{width:80px;height:80px;border-radius:8px;object-fit:cover;background:#f5f5f5;flex:0 0 auto}'+
      '#'+GIFT_ID+' .body{flex:1;min-width:0}'+
      '#'+GIFT_ID+' .nm{display:block;font-size:15px;font-weight:700;color:#1a1a1a}'+
      '#'+GIFT_ID+' .tag{display:inline-block;margin-top:5px;background:#f4d44e;color:#173a2b;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}'+
      '#'+GIFT_ID+' .pr{margin-top:7px;font-size:14px}'+
      '#'+GIFT_ID+' .old{color:#94a3b8;text-decoration:line-through;margin-right:8px}'+
      '#'+GIFT_ID+' .free{color:#1f8354;font-weight:800}'+
      '#'+MORE_ID+'{display:block;text-align:center;margin:10px 0 4px;margin-right:10px;margin-bottom:10px;margin-left:10px;padding:11px;border-radius:10px;'+
        'border:1.5px solid #1f5038;color:#173a2b;font-family:hind-siliguri,sans-serif;font-size:13.5px;font-weight:700;'+
        'text-decoration:none;background:#fff}'+
      '#'+MORE_ID+':active{background:#f1faf4}';
    document.head.appendChild(s);
  }

  function findHeader(){
    var els = document.querySelectorAll('h1,h2,h3,h4,div,span,p');
    for (var i=0;i<els.length;i++){
      var t = (els[i].textContent||'').trim();
      if (/^মোট\s*আইটেম/.test(t) && t.length<40 && els[i].offsetParent!==null) return els[i];
    }
    return null;
  }

  // Anchor is always OUTSIDE the Angular-owned row list: before it (progress
  // bar) or after it (gift row / CTA), never a child of it.
  function panelAnchor(){
    var r = rows();
    if (r.length && r[0].parentElement) return { list: r[0].parentElement };
    var h = findHeader();
    if (h) return { header: h };
    return null;
  }

  function place(el, before){
    var a = panelAnchor(); if (!a) return false;
    if (a.list && a.list.parentNode){
      if (before) a.list.parentNode.insertBefore(el, a.list);
      else a.list.parentNode.insertBefore(el, a.list.nextSibling);
      return true;
    }
    if (a.header && a.header.parentNode){
      a.header.parentNode.insertBefore(el, a.header.nextSibling);
      return true;
    }
    return false;
  }

  // Re-rendering innerHTML every tick recreated the .fill node each time —
  // it always starts at width:0, so the setTimeout-driven CSS transition
  // replayed 0%->pct on every 800ms poll, flickering. Now only rewrite the
  // markup when the visible content actually changes; otherwise just update
  // the existing .fill width directly (no node replaced, no transition
  // restart).
  var lastSig = null;
  function renderProgress(cfg, state){
    var threshold = Number(cfg.giftMinAmount) || 0;
    var earned = threshold>0 && state.total>=threshold;
    var box = document.getElementById(PROGRESS_ID);

    if (!earned && threshold<=0){ if (box) box.parentNode.removeChild(box); lastSig=null; return false; }
    if (!box){
      box = document.createElement('div'); box.id = PROGRESS_ID;
      if (!place(box, true)) return earned;
      lastSig = null;
    }

    var remaining = Math.max(0, Math.ceil(threshold - state.total));
    var pct = earned?100:Math.min(100, threshold>0?Math.round((state.total/threshold)*100):0);
    var img = giftImageCache || (cfg.giftProduct && cfg.giftProduct.image) || '';
    var sig = earned+'|'+remaining+'|'+img;

    if (sig !== lastSig){
      lastSig = sig;
      var imgHtml = img ? '<img class="nb" src="'+img+'" alt="ফ্রি নোটবুক">' : '';
      var msg = earned
        ? '<div class="h">🎉 অভিনন্দন! আপনি এই আকর্ষণীয় নোটবুকটি <b>Gift</b> পেয়েছেন 🎁</div>'
        : '<div class="h">🎁 আর মাত্র <b>৳'+toBn(remaining)+'</b> টাকার বই যোগ করুন — পেয়ে যান <b>৮০ পেইজের ফ্রি নোটবুক</b>!</div>';
      box.innerHTML = '<div class="row">'+imgHtml+'<div class="t">'+msg+'<div class="bar"><div class="fill"></div></div></div></div>';
      var f = box.querySelector('.fill');
      if (f) setTimeout(function(){ f.style.width = pct+'%'; }, 50);
    } else {
      var f2 = box.querySelector('.fill');
      if (f2) f2.style.width = pct+'%';
    }
    return earned;
  }

  // The notebook's own sale price AND its real cover image aren't reliable on
  // the OrderOffer config — price isn't there at all, and the config's
  // giftProduct.image field is stale (points at a deleted upload, 404s).
  // Both are fetched fresh from the product's own record (same one the
  // product-details page reads) and cached; if it isn't back yet the row
  // still renders (just without the strikethrough/image) rather than
  // blocking on it.
  var giftPriceCache = null, giftImageCache = null, giftPricePending = false;
  function warmGiftPrice(cfg){
    if ((giftPriceCache!=null && giftImageCache!=null) || giftPricePending) return;
    var slug = cfg.giftProduct && cfg.giftProduct.slug; if (!slug) return;
    giftPricePending = true;
    fetch(API_BASE+'/product/get-by-slug/'+encodeURIComponent(slug)).then(function(r){return r.json();}).then(function(res){
      giftPricePending = false;
      var d = res && res.data;
      var p = d ? (d.regularPrice!=null?d.regularPrice:d.salePrice) : null;
      if (p!=null) giftPriceCache = Number(p);
      var img = d && Array.isArray(d.images) && d.images[0] ? d.images[0] : (d && d.image) || null;
      if (img) giftImageCache = img;
    }).catch(function(){ giftPricePending = false; });
  }

  // This row is DISPLAY ONLY — it is never written into the real cart.
  // Backend reasoning (order.service.ts newOrderMake/evaluateGiftLine):
  // every line is re-priced server-side from the live product record, and
  // evaluateGiftLine explicitly SKIPS adding the real free line if the gift
  // product is already present among the submitted items. So actually
  // adding the notebook to the guest localStorage cart (or via the
  // authenticated add-to-cart API) would make the customer get CHARGED the
  // real ৳150 for it AND suppress the real free line — the opposite of the
  // feature. The real ৳0 gift line is attached correctly server-side at
  // order creation regardless; this row just needs to look like it's
  // already in the list, so it's placed directly after the last real item
  // (not inside Angular's row list, still a plain sibling) and styled to
  // match a real row.
  function placeAfterListArea(el){
    var a = panelAnchor(); if (!a || !a.list) return false;
    var anchor = document.getElementById(GIFT_ID) || a.list;
    if (!anchor.parentNode) return false;
    anchor.parentNode.insertBefore(el, anchor.nextSibling);
    return true;
  }

  // Rebuilds only when its content actually changes (same signature-diff
  // pattern as renderProgress) — needed because giftImageCache/giftPriceCache
  // arrive asynchronously and may still be empty on the tick the row first
  // gets created; without this the row would render once with no image and
  // never pick the real one up.
  var lastGiftSig = null;
  function renderGiftRow(cfg, earned){
    var row = document.getElementById(GIFT_ID);
    if (!earned){ if (row) row.parentNode.removeChild(row); lastGiftSig = null; return; }
    var img = giftImageCache || (cfg.giftProduct && cfg.giftProduct.image) || '';
    var nm = (cfg.giftProduct && cfg.giftProduct.name) || cfg.giftLabel || 'ফ্রি নোটবুক';
    var sig = img+'|'+giftPriceCache;
    if (row && sig === lastGiftSig) return;
    lastGiftSig = sig;
    var oldPrice = giftPriceCache!=null ? '<span class="old">৳'+toBn(giftPriceCache)+'</span>' : '';
    var html = (img?'<img src="'+img+'" alt="'+nm+'">':'') +
      '<div class="body"><span class="nm">'+nm+'</span>'+
      '<span class="tag">🎁 ফ্রি গিফট</span>'+
      '<div class="pr">'+oldPrice+'<span class="free">৳০</span></div></div>';
    if (row){ row.innerHTML = html; return; }
    row = document.createElement('div'); row.id = GIFT_ID; row.innerHTML = html;
    var a = panelAnchor();
    if (a && a.list && a.list.parentNode) a.list.parentNode.insertBefore(row, a.list.nextSibling);
    else place(row, false);
  }

  function renderMoreBooks(){
    if (document.getElementById(MORE_ID)) return;
    var a = document.createElement('a'); a.id = MORE_ID; a.href = '/product-list'; a.textContent = '+ আরও বই কিনুন';
    if (!placeAfterListArea(a)) place(a, false);
  }

  function clearAll(){
    [PROGRESS_ID, GIFT_ID, MORE_ID].forEach(function(id){
      var el = document.getElementById(id); if (el && el.parentNode) el.parentNode.removeChild(el);
    });
  }

  // Zero-reload, display-only. A "real cart line via silent write + proxy
  // nudge" version exists and works (verified live), but was set aside in
  // favor of this simpler always-safe overlay. The real ৳0 gift line still
  // attaches correctly server-side at actual order creation regardless
  // (evaluateGiftLine, order.service.ts), independent of this row.
  function tick(){
    if (!onCheckout()) { clearAll(); return; }
    if (!panelAnchor()) return;
    if (!cfgCache){
      if (cfgPending) return;
      cfgPending = true;
      fetch(API_BASE+'/order-offer/get').then(function(r){return r.json();}).then(function(res){
        cfgPending = false;
        if (res && res.data && (res.data.giftEnabled || res.data.giftMinAmount)) { cfgCache = res.data; warmGiftPrice(cfgCache); }
      }).catch(function(){ cfgPending = false; });
      return;
    }
    styleOnce();
    var state = cartState();
    var earned = renderProgress(cfgCache, state);
    renderGiftRow(cfgCache, earned);
    renderMoreBooks();
  }

  setInterval(tick, 800);
  document.addEventListener('DOMContentLoaded', tick);
  tick();
})();
</script>
<script src="/ab-widgets.js?v=18" defer></script>
