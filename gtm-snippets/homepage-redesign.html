    var discount = regular > price && regular ? Math.max(1, Math.min(99, Math.round((regular - price) * 100 / regular))) : 0;
    var count = books.length;
    var covers = books.slice(0, 3).map(function (book, index) {
      return '<span class="ab-home-pack-cover ab-home-pack-cover--' + (index + 1) + '"><img ' + responsiveImage(book) + ' alt="" width="320" height="426" loading="lazy" fetchpriority="low" decoding="async"></span>';
    }).join('');
    var media = covers || '<img src="' + escapeHtml(item.image || '/assets/images/placeholder/test.png') + '" alt="" loading="lazy" decoding="async">';
    var countLabel = count ? count.toLocaleString('bn-BD') + 'টি বইয়ের প্যাকেজ' : 'বিশেষ প্যাকেজ';
    return '<article class="ab-home-card ab-home-card--package" data-package-id="' + escapeHtml(item._id) + '" data-list-name="' + escapeHtml(listName) + '">' +
      '<a href="/special-package-details/' + encodeURIComponent(item._id) + '" aria-label="' + escapeHtml((item.name || 'প্যাকেজ') + ' — ' + countLabel) + '">' +
        '<div class="ab-home-card-media ab-home-pack">' +
          (discount ? '<span class="ab-home-discount">' + escapeHtml(discount) + '% ছাড়</span>' : '') +
          media +
          '<span class="ab-home-pack-count">' + escapeHtml(countLabel) + '</span>' +
        '</div>' +
        '<h3>' + escapeHtml(item.name || '') + '</h3>' +
        (PACKAGE_OFFERS[String(item._id)]
          ? '<p class="ab-home-author ab-home-pack-offer" title="' + escapeHtml(books.map(function (book) { return book.name; }).join(' + ')) + '">' + escapeHtml(PACKAGE_OFFERS[String(item._id)]) + '</p>'
          : '<p class="ab-home-author">' + escapeHtml(books.map(function (book) { return book.name; }).join(' + ')) + '</p>') +
        '<p class="ab-home-price"><span>' + escapeHtml(money(price)) + '</span>' + (regular > price ? '<s>' + escapeHtml(money(regular)) + '</s>' : '') + '</p>' +
      '</a>' +
      '<button class="ab-add-cart-button ab-add-package-button" type="button" data-package-id="' + escapeHtml(item._id) + '">কার্টে যোগ করুন</button>' +
    '</article>';
  }
  // Packages go in through the cart code every shop page loads (storefront-product-sections);
  // its button words are English, so they are kept in Bengali here.
  var PACKAGE_BUTTON_WORDS = { 'Adding…': 'যোগ হচ্ছে…', 'Adding...': 'যোগ হচ্ছে…', 'Added': 'যোগ হয়েছে', 'Add to Cart': 'কার্টে যোগ করুন' };
  function addPackageToCart(button) {
    var id = button.getAttribute('data-package-id');
    var bridge = window.__abCommerceBridge;
    if (!id) return;
    if (!bridge || typeof bridge.addSpecialPackageToCart !== 'function') {
      location.href = '/special-package-details/' + encodeURIComponent(id);
      return;
    }
    if (button.disabled) return;
    var keepBengali = new MutationObserver(function () {
      var word = PACKAGE_BUTTON_WORDS[String(button.textContent || '').trim()];
      if (word && button.textContent !== word) button.textContent = word;
    });
    keepBengali.observe(button, { childList: true, characterData: true, subtree: true });
    setTimeout(function () { keepBengali.disconnect(); }, 15000);
    Promise.resolve(bridge.addSpecialPackageToCart(id, button)).catch(function () {
      button.textContent = 'কার্টে যোগ করুন';
      button.disabled = false;
    });
  }
  function render(products) {
    var nativeHome = document.querySelector('app-home');
    if (!nativeHome || !nativeHome.parentNode || !products.length || location.pathname !== '/' || new URLSearchParams(location.search).get('home') === 'legacy' || document.getElementById(ROOT_ID)) return;
    productsById = products.reduce(function (result, product) {
      result[String(product._id)] = product;
      return result;
    }, {});
    indexProducts(products);
    var goalLinks = goals.map(function (goal, index) {
      return '<a class="ab-home-goal" href="' + escapeHtml(categoryUrl(goal.match, goal.fallback)) + '" data-goal="' + escapeHtml(goal.label) + '"><span class="ab-home-goal-index">0' + (index + 1) + '</span><strong>' + escapeHtml(goal.label) + '</strong><span class="ab-home-goal-arrow" aria-hidden="true">→</span></a>';
    }).join('');
    var shelfData = shelves.map(function (shelf) {
      var packages = packagesForShelf(shelf);
      return { shelf: shelf, packages: packages, products: productsForShelf(products, shelf).slice(0, Math.max(0, (shelf.size || 12) - packages.length)) };
    });
    var authorsHtml = nameStripHtml('ab-home-authors', 'জনপ্রিয় লেখক', uniqueEntities(products, 'author'), 'author', '/author-list');
    var publishersHtml = nameStripHtml('ab-home-publishers', 'জনপ্রিয় প্রকাশনী', uniqueEntities(products, 'publisher'), 'publisher', '/publisher-list');
    var goalsHtml = '<section class="ab-home-goals" aria-labelledby="ab-home-goals-title"><div class="ab-home-shell"><div class="ab-home-section-head"><h2 id="ab-home-goals-title">আপনার প্রয়োজন অনুযায়ী</h2><a class="ab-home-all-link" href="/category-list">সব বিষয়</a></div><div class="ab-home-goal-grid">' + goalLinks + '</div></div></section>';
    renderedCards = 0;
    var root = document.createElement('main');
    root.id = ROOT_ID;
    root.innerHTML = shelfData.map(function (entry, index) {
      var shelfHtml = sectionHtml('ab-home-' + entry.shelf.id, entry.shelf.title, entry.products, '/product-list', entry.packages.map(function (item) { return packageCard(item, 'ab-home-' + entry.shelf.id); }).join(''));
      return shelfHtml + (index === 1 ? quizHtml() : '') + (index === 4 ? goalsHtml : '') + (index === 6 ? authorsHtml : '') + (index === 8 ? publishersHtml : '');
    }).join('') +
      '<nav class="ab-home-shell ab-home-trust" aria-label="অর্ডার সহায়তা"><a href="/pages/how-to-order-website">কীভাবে অর্ডার করবেন <span aria-hidden="true">→</span></a><a href="/pages/delivery-policy">ডেলিভারি নীতি <span aria-hidden="true">→</span></a><a href="/pages/return-&-refund-policy">ফেরত ও পরিবর্তন <span aria-hidden="true">→</span></a></nav>';
    nativeHome.parentNode.insertBefore(root, nativeHome);
    document.documentElement.classList.add('ab-home-redesign');
    document.body.classList.add('ab-home-redesign');
    setPending(false);
    mountedPath = location.pathname;
    decorateCovers();
    showEntityImages(root);
    var quizStarted = false;
    root.querySelector('.ab-book-quiz-form').addEventListener('change', function () {
      if (quizStarted) return;
      quizStarted = true;
      pushEvent('ab_home_quiz_start', {});
    });
    root.addEventListener('click', function (event) {
      var packageButton = event.target.closest('.ab-add-package-button');
      if (packageButton) {
        event.preventDefault();
        addPackageToCart(packageButton);
        return;
      }
      var goal = event.target.closest('.ab-home-goal');
      if (goal) pushEvent('ab_home_goal_click', { content_name: goal.getAttribute('data-goal') });
      var card = event.target.closest('.ab-home-card');
      if (card && event.target.closest('a')) {
        var product = productsById[card.getAttribute('data-product-id')];
        if (product) pushEcommerce('select_item', card.getAttribute('data-list-name'), [product]);
      }
    });
    root.querySelector('.ab-book-quiz-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var form = new FormData(event.currentTarget);
      var topic = String(form.get('topic') || 'সব');
      var reader = String(form.get('reader') || 'new');
      var quantity = String(form.get('quantity') || 'three');
      var recommendations = recommendProducts(products, topic, reader, quantity);
      var results = root.querySelector('.ab-book-quiz-results');
      results.innerHTML = '<h3 tabindex="-1">' + recommendationTitle(recommendations.length) + '</h3>' +
        '<div class="ab-home-grid">' + recommendations.map(function (product) { return productCard(product, 'ab-home-quiz'); }).join('') + '</div>';
      decorateCovers();
      results.querySelector('h3').focus({ preventScroll: true });
      results.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
      pushEvent('ab_home_quiz_complete', { topic: topic, reader_type: reader, result_count: recommendations.length });
    });
    shelfData.forEach(function (entry) {
      if (entry.products.length) pushEcommerce('view_item_list', 'ab-home-' + entry.shelf.id, entry.products);
    });
  }
  function cleanup() {
    requestSerial += 1;
    var root = document.getElementById(ROOT_ID);
    if (root) root.remove();
    document.documentElement.classList.remove('ab-home-redesign');
    if (document.body) document.body.classList.remove('ab-home-redesign');
    setPending(false);
    mountedPath = '';
    loading = false;
    productsById = {};
    pendingCarts = {};
  }
  function update() {
    ensureHeaderTicker();
    decorateCovers();
    if (!coverDataRequested && document.querySelector('a[href*="/product-details/"]')) {
      coverDataRequested = true;
      fetchProducts().then(function (result) {
        var products = result && Array.isArray(result.data) ? result.data : [];
        indexProducts(products);
        decorateCovers();
      }).catch(function () { /* Badges work without rating data. */ });
    }
    var routeKey = location.pathname + location.search;
    if (!wantsRedesign()) {
      failedRoute = '';
      setPending(false);
      if (mountedPath || document.getElementById(ROOT_ID)) cleanup();
      return;
    }
    if (failedRoute === routeKey || document.getElementById(ROOT_ID)) {
      setPending(false);
      return;
    }
    if (loading) return;
    var nativeHome = document.querySelector('app-home');
    if (!nativeHome || !nativeHome.parentNode) return;
    setPending(true);
    loading = true;
    var serial = ++requestSerial;
    Promise.all([fetchProducts(), fetchShelfPackages()]).then(function (loaded) {
      var result = loaded[0];
      shelfPackages = loaded[1] || [];
      if (serial !== requestSerial || location.pathname !== '/' || new URLSearchParams(location.search).get('home') === 'legacy') return;
      var products = result && Array.isArray(result.data) ? result.data : [];
      if (!products.length) throw new Error('Empty catalogue');
      render(products);
      if (!result.shelfPicks) {
        loadShelfPicks(result).then(function (full) {
          if (full && serial === requestSerial && location.pathname === '/') upgradeShelves(full.data);
        });
      }
    }).catch(function () {
      if (serial !== requestSerial) return;
      failedRoute = routeKey;
      cleanup();
    }).finally(function () {
      if (serial === requestSerial) loading = false;
    });
  }
  window.addEventListener('click', function (event) {
    var root = document.getElementById(ROOT_ID);
    var add = event.target && event.target.closest && event.target.closest('.ab-add-cart-button');
    var card = add && add.closest('.ab-home-card');
    if (!root || !add || !card || !root.contains(add)) return;
    var id = String(add.getAttribute('data-product-id') || '');
    if (!id) return;
    var queue = pendingCarts[id] || [];
    queue = queue.filter(function (intent) { return Date.now() - intent.createdAt < 30000; });
    queue.push({ listName: card.getAttribute('data-list-name'), createdAt: Date.now() });
    pendingCarts[id] = queue;
  }, true);
  window.addEventListener('amol-cart-added', function (event) {
    var id = String(event && event.detail && (event.detail.product || event.detail.productId || event.detail.product_id || event.detail._id) || '');
    var queue = (pendingCarts[id] || []).filter(function (intent) { return Date.now() - intent.createdAt < 30000; });
    var intent = queue.shift();
    if (intent && location.pathname === '/') {
      var product = productsById[id];
      if (product) pushEcommerce('add_to_cart', intent.listName, [product]);
    }
    if (queue.length) pendingCarts[id] = queue;
    else delete pendingCarts[id];
  });
  var updateScheduled = false;
  function scheduleUpdate() {
    if (updateScheduled) return;
    updateScheduled = true;
    requestAnimationFrame(function () {
      updateScheduled = false;
      update();
    });
  }
  new MutationObserver(function () {
    // Hide the app's home in the same task Angular adds it, before it can paint.
    if (wantsRedesign() && !document.getElementById(ROOT_ID) && failedRoute !== location.pathname + location.search) setPending(true);
    scheduleUpdate();
  }).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('popstate', scheduleUpdate);
  // History updates can change the route without adding any DOM nodes.
  var lastRoute = location.pathname + location.search;
  window.setInterval(function () {
    var route = location.pathname + location.search;
    if (route !== lastRoute) {
      lastRoute = route;
      scheduleUpdate();
    }
  }, 1000);
  update();
})();
</script>
