      if (!available(product) || isOpen() || addingOffer || missingBook(cartIds(extraIds)) !== missing) return;
      open(product, added);
    });
  }
  // At checkout (e.g. after Buy Now), offer it once per visit while two of the three are in the cart.
  function checkCheckout() {
    if (!onCheckout() || isOpen() || addingOffer || flag(CHECKOUT_SHOWN_KEY)) return;
    if (!missingBook(cartIds())) return;
    setFlag(CHECKOUT_SHOWN_KEY);
    maybeShow([], null);
  }
  window.setInterval(checkCheckout, 1000);

  function open(product, added) {
    lastFocus = document.activeElement;
    hideSiteModal();
    var id = String(product._id);
    var name = product.name || BOOKS[id].name;
    var link = '/product-details/' + encodeURIComponent(product.slug || BOOKS[id].slug);
    var inCart = BOOK_IDS.filter(function (bookId) { return bookId !== id; }).map(function (bookId) { return '“' + BOOKS[bookId].name + '”'; });
    var root = el('div');
    root.id = ROOT_ID;
    var card = el('div', 'ab-po-card');
    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-modal', 'true');
    card.setAttribute('aria-labelledby', 'ab-po-title');
    card.setAttribute('aria-describedby', 'ab-po-lead');
    root.appendChild(card);

    var head = el('div', 'ab-po-head');
    if (added != null) {
      var addedLine = el('p', 'ab-po-added');
      addedLine.appendChild(icon(CHECK));
      addedLine.appendChild(document.createTextNode((added ? '“' + added + '”' : 'বইটি') + ' কার্টে যুক্ত হয়েছে'));
      head.appendChild(addedLine);
    }
    var badge = el('span', 'ab-po-badge');
    badge.appendChild(icon(TRUCK));
    badge.appendChild(document.createTextNode('ফ্রি ডেলিভারি অফার'));
    head.appendChild(badge);
    var title = el('h2', 'ab-po-title', 'এই বইটি সাথে নিন, ডেলিভারি একদম ফ্রি!');
    title.id = 'ab-po-title';
    head.appendChild(title);
    var lead = el('p', 'ab-po-lead', 'আপনার কার্টে ' + inCart.join(' ও ') + ' আছে। সাথে “' + name + '” যোগ করলেই পুরো অর্ডারের ডেলিভারি চার্জ লাগবে না।');
    lead.id = 'ab-po-lead';
    head.appendChild(lead);
    var closeButton = el('button', 'ab-po-close', '×');
    closeButton.type = 'button';
    closeButton.setAttribute('aria-label', 'বন্ধ করুন');
    closeButton.addEventListener('click', close);
    card.appendChild(closeButton);
    card.appendChild(head);

    var body = el('div', 'ab-po-body');
    var cover = el('a', 'ab-po-cover');
    cover.href = link;
    cover.setAttribute('aria-label', name + ' — বিস্তারিত দেখুন');
    var image = el('img');
    image.src = imageUrl(product);
    image.alt = name;
    image.width = 136;
    image.height = 204;
    cover.appendChild(image);
    body.appendChild(cover);

    var info = el('div');
    info.appendChild(el('h3', 'ab-po-name', name));
    var author = names(product.author);
    if (author) info.appendChild(el('p', 'ab-po-author', author));
    var facts = el('dl', 'ab-po-facts');
    [['পৃষ্ঠা', product.totalPages ? String(product.totalPages) : ''],
     ['প্রকাশনী', names(product.publisher)],
     ['সংস্করণ', product.edition || ''],
     ['ভাষা', (Array.isArray(product.language) ? product.language : [product.language]).filter(Boolean).map(function (lang) { return lang === 'Bangla' ? 'বাংলা' : lang; }).join(', ')]
    ].forEach(function (fact) {
      if (!fact[1]) return;
      facts.appendChild(el('dt', '', fact[0]));
      facts.appendChild(el('dd', '', fact[1]));
    });
    info.appendChild(facts);
    var price = product.fallback ? null : finalPrice(product);
    if (price) {
      var priceRow = el('p', 'ab-po-price');
      priceRow.appendChild(el('span', 'ab-po-now', 'Tk ' + price.now));
      if (price.was > price.now) {
        priceRow.appendChild(el('span', 'ab-po-was', 'Tk ' + price.was));
        priceRow.appendChild(el('span', 'ab-po-save', 'সাশ্রয় Tk ' + (price.was - price.now)));
      }
      info.appendChild(priceRow);
    }
    body.appendChild(info);

    var about = el('div', 'ab-po-about');
    var description = plainText(product.shortDescription) || plainText(product.description);
    if (description) {
      about.appendChild(el('h4', '', 'বই সম্পর্কে'));
      about.appendChild(el('p', 'ab-po-desc', description));
    }
    var more = el('a', 'ab-po-more', 'বিস্তারিত দেখুন →');
    more.href = link;
    about.appendChild(more);
    body.appendChild(about);
    card.appendChild(body);
    [cover, more].forEach(function (anchor) { anchor.addEventListener('click', close); });

    var free = el('div', 'ab-po-free');
    free.appendChild(icon(TRUCK));
    free.appendChild(el('span', '', 'তিনটি বই একসাথে অর্ডার করলে ডেলিভারি চার্জ Tk 0'));
    card.appendChild(free);

    var actions = el('div', 'ab-po-actions');
    var add = el('button', 'ab-po-primary', 'কার্টে যোগ করুন — ফ্রি ডেলিভারি');
    add.type = 'button';
    var error = el('p', 'ab-po-error');
    error.setAttribute('role', 'alert');
    error.hidden = true;
    var decline = el('button', 'ab-po-secondary', 'না, ধন্যবাদ');
    decline.type = 'button';
    decline.addEventListener('click', close);
    add.addEventListener('click', function () {
      add.disabled = true;
      add.textContent = 'যোগ করা হচ্ছে…';
      error.hidden = true;
      addOffer(product).then(function () { showAdded(actions); }, function () {
        add.disabled = false;
        add.textContent = 'কার্টে যোগ করুন — ফ্রি ডেলিভারি';
        error.textContent = 'দুঃখিত, বইটি যোগ করা যায়নি। আবার চেষ্টা করুন।';
        error.hidden = false;
      });
    });
    actions.appendChild(add);
    actions.appendChild(error);
    actions.appendChild(decline);
    card.appendChild(actions);

    root.addEventListener('click', function (event) { if (event.target === root) close(); });
    document.body.appendChild(root);
    document.documentElement.classList.add('ab-pair-offer-open');
    document.addEventListener('keydown', onKeydown, true);
    try { add.focus({ preventScroll: true }); } catch (_) { add.focus(); }
  }
  function showAdded(actions) {
    actions.textContent = '';
    var done = el('div', 'ab-po-done');
    done.setAttribute('role', 'status');
    done.appendChild(icon(CHECK));
    var text = el('div');
    text.appendChild(el('strong', '', 'বইটি কার্টে যোগ হয়েছে!'));
    text.appendChild(el('span', '', 'এই অর্ডারে আপনার ডেলিভারি এখন ফ্রি।'));
    done.appendChild(text);
    actions.appendChild(done);
    var atCheckout = onCheckout();
    var next = el('button', 'ab-po-primary', atCheckout ? 'ঠিক আছে' : 'অর্ডার করুন');
    next.type = 'button';
    next.addEventListener('click', function () {
      close();
      if (!atCheckout) window.location.assign('/checkout');
    });
    actions.appendChild(next);
    if (!atCheckout) {
      var keep = el('button', 'ab-po-secondary', 'আরও বই দেখুন');
      keep.type = 'button';
      keep.addEventListener('click', close);
      actions.appendChild(keep);
    }
    next.focus();
  }

  /* ── Adding the book ── */
  function addGuestItem(product) {
    var id = String(product._id);
    var item = { product: id, selectedQty: 1, cartType: 0 };
    var cart = cartService();
    if (cart && typeof cart.addCartItemToLocalStorage === 'function') {
      cart.addCartItemToLocalStorage(item);
    } else {
      var items = readJson(GUEST_CART_KEY);
      var existing = items.filter(function (entry) { return entry && productId(entry) === id && entry.cartType !== 1; })[0];
      if (existing) existing.selectedQty = Math.max(1, Number(existing.selectedQty) || 1) + 1;
      else items.push(item);
      localStorage.setItem(GUEST_CART_KEY, JSON.stringify(items));
    }
    // Local preview only: the product-page script keeps its own copy of the cart there.
    if (local && localStorage.getItem(LOCAL_PREVIEW_CART_KEY) !== null) {
      localStorage.setItem(LOCAL_PREVIEW_CART_KEY, localStorage.getItem(GUEST_CART_KEY) || '[]');
    }
    // Same event the product page sends; marked handled so no second "added" message shows.
    var price = finalPrice(product);
    var value = price ? price.now : 0;
    window.dataLayer = window.dataLayer || [];
    window.__amolCartUiEventHandled = true;
    try {
      window.dataLayer.push({ ecommerce: null });
      window.dataLayer.push({ event: 'add_to_cart', __amolCartUiHandled: true, ecommerce: { currency: 'BDT', value: value, items: [{ item_id: id, item_name: product.name || BOOKS[id].name, price: value, quantity: 1 }] } });
    } finally {
      window.__amolCartUiEventHandled = false;
    }
  }
  function addAccountItem(product) {
    var item = { product: String(product._id), selectedQty: 1, cartType: 0 };
    var cart = cartService();
    if (cart && typeof cart.addToCart === 'function') {
      return new Promise(function (resolve, reject) {
        cart.addToCart(item).subscribe({
          next: function (response) { if (response && response.success !== false) resolve(); else reject(new Error('Not added')); },
          error: reject
        });
      });
    }
    return fetch(API_BASE + '/cart/add-to-cart', {
      method: 'POST',
      headers: { Authorization: authorization(), 'Content-Type': 'application/json' },
      body: JSON.stringify(item)
    }).then(function (response) { return response.json(); }).then(function (response) {
      if (!response || response.success === false) throw new Error('Not added');
    });
  }
  function addOffer(product) {
    addingOffer = true;
    // A signed-in add is reported by the tracking script, which would reopen the site's modal.
    hideSiteModalUntil = Date.now() + 5000;
    var pending;
    try {
      pending = loggedIn() ? addAccountItem(product) : Promise.resolve(addGuestItem(product));
    } catch (error) {
      pending = Promise.reject(error);
    }
    return pending.then(function () {
      addingOffer = false;
      var reload = cartService() && cartService().reloadService;
      // Header count and the checkout's own cart (and so its delivery charge) reload in place.
      try { if (reload) reload.needRefreshCart$(false); } catch (_) { /* Next page shows it. */ }
      window.dispatchEvent(new Event('storage'));
      window.dispatchEvent(new CustomEvent('ab-cart-updated', { detail: { product: String(product._id) } }));
    }, function (error) {
      addingOffer = false;
      throw error;
    });
  }
}());
</script>
