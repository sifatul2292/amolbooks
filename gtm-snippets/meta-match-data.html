<!-- All Pages, first in the head. Meta match data for the storefront's own Conversions API calls (/api/gtag/track-theme-*): the real click ID, one stable external ID, and this visitor's own hashed details instead of the compiled app's stand-in values. Raw personal data is never stored. -->
<script>
(function () {
  if (window.__amolMetaMatchData) return;
  window.__amolMetaMatchData = true;

  var ANON_KEY = 'amol_analytics_anonymous_id';
  var ATTRIBUTION_KEY = 'amol_attribution_v1';
  var CUSTOMER_KEY = 'ab_meta_customer';
  var FBC_MAX_AGE_S = 90 * 24 * 60 * 60;
  var COUNTRY_BD = '5e657ff6158d3e2a6d23e2a523917a2305acee9423365e268695c4b7b8919f4c';
  /* SHA-256 of the compiled app's stand-ins: 8801700000000, noemail@gmail.com,
     global, Mr, Unknown, 1200, 19970216; gender m; state bd. */
  var PLACEHOLDERS = {
    ph: '12c84ad04eb79fc11a96dc89aa966423ff15513b1257bcacacdd93db3c509112',
    em: '273b992af6be87f42c417f5bc2e8e2e1547668d9e1d11b22fdf467d252facb62',
    ct: '8001c27439650c5c5a6b4ed94163b5ddeb4476362c71380e613fa20dfffcef50',
    fn: '7820f1b6fd39bb5b0c5e597637fbdd1c08741651302f45e48116a18fda4b4f75',
    ln: 'b764cdc0eab7137467211272fa539f1260d1bf2e71bcf6ff3bdc960f5c16aa14',
    zp: '15197cf7214b58e67cae565e573ffd9aa44bcb81f8ee5d7185dfe8da0a16ef43',
    db: '01acdbf6ec7b4f478a225f1a246e5d6767eeab1a7ffa17f025265b5b94f40f0c'
  };
  var PLACEHOLDER_GENDER = '62c66a7a5dd70c3146618063c344e531e6d4b59e379808443ce962b3abd63c5a';
  var PLACEHOLDER_STATE = COUNTRY_BD;

  function readCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : '';
  }

  function readJson(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (_) { return null; }
  }

  /* Same key and format as the attribution script, so Purchase (which sends this
     ID as external_id) and every earlier event share one ID. */
  function anonymousId() {
    try {
      var existing = localStorage.getItem(ANON_KEY);
      if (existing) return existing;
      var value = window.crypto && typeof window.crypto.randomUUID === 'function'
        ? window.crypto.randomUUID()
        : 'anon-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
      localStorage.setItem(ANON_KEY, value);
      return value;
    } catch (_) {
      return '';
    }
  }

  /* Click ID: Meta's pixel writes _fbc only after it loads, so the first server
     events went out without it. Write it as soon as the page opens. */
  function writeFbc(value) {
    var host = location.hostname;
    var domain = /(^|\.)amolbooks\.com$/.test(host) ? '; domain=.amolbooks.com' : '';
    var secure = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = '_fbc=' + encodeURIComponent(value) + '; path=/; max-age=' + FBC_MAX_AGE_S + '; SameSite=Lax' + domain + secure;
  }

  var clickId = '';
  try { clickId = String(new URLSearchParams(location.search).get('fbclid') || '').slice(0, 500); } catch (_) {}
  if (clickId) {
    var existingFbc = readCookie('_fbc');
    if (existingFbc.split('.').slice(3).join('.') !== clickId) writeFbc('fb.1.' + Date.now() + '.' + clickId);
  }

  function currentFbc() {
    var cookie = readCookie('_fbc');
    if (cookie) return cookie;
    var saved = readJson(ATTRIBUTION_KEY) || {};
    var touches = [saved.lastTouch, saved.firstTouch];
    for (var index = 0; index < touches.length; index += 1) {
      var touch = touches[index];
      if (!touch) continue;
      if (touch.fbc) return touch.fbc;
      var capturedAt = Date.parse(touch.capturedAt || '');
      if (touch.fbclid && capturedAt && Date.now() - capturedAt < FBC_MAX_AGE_S * 1000) {
        return 'fb.1.' + capturedAt + '.' + touch.fbclid;
      }
    }
    return '';
  }

  /* Known customer: hashed with the same normalisation as the server's Purchase
     event so Meta links this visitor's earlier events to their order. */
  function asciiDigits(text) {
    return String(text || '').replace(/[০-৯]/g, function (digit) { return String('০১২৩৪৫৬৭৮৯'.indexOf(digit)); });
  }

  function normalizedPhone(raw) {
    var digits = asciiDigits(raw).replace(/\D/g, '');
    if (digits.length < 3) return '';
    if (digits.indexOf('880') === 0) return digits;
    if (digits.length === 10 && digits.charAt(0) === '1') return '880' + digits;
    if (digits.length === 11 && digits.charAt(0) === '0') return '88' + digits;
    return digits.indexOf('88') === 0 ? digits : '88' + digits;
  }

  function sha256(text) {
    if (!window.crypto || !window.crypto.subtle || typeof TextEncoder === 'undefined') return Promise.resolve('');
    return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(text).trim().toLowerCase())).then(function (buffer) {
      return Array.prototype.map.call(new Uint8Array(buffer), function (byte) {
        return ('0' + byte.toString(16)).slice(-2);
      }).join('');
    });
  }

  function savedCustomer() {
    var saved = readJson(CUSTOMER_KEY);
    return saved && typeof saved === 'object' ? saved : {};
  }

  window.__amolRememberMetaCustomer = function (details) {
    details = details || {};
    var nameParts = String(details.name || '').trim().split(/\s+/).filter(Boolean);
    var phone = normalizedPhone(details.phone);
    var email = String(details.email || '').trim();
    var pending = {
      ph: phone ? sha256(phone) : null,
      em: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? sha256(email) : null,
      fn: nameParts[0] ? sha256(nameParts[0]) : null,
      ln: nameParts.length > 1 ? sha256(nameParts.slice(1).join('')) : null
    };
    var keys = Object.keys(pending).filter(function (key) { return pending[key]; });
    return Promise.all(keys.map(function (key) { return pending[key]; })).then(function (hashes) {
      var saved = savedCustomer();
      keys.forEach(function (key, index) { if (hashes[index]) saved[key] = hashes[index]; });
      saved.savedAt = new Date().toISOString();
      try { localStorage.setItem(CUSTOMER_KEY, JSON.stringify(saved)); } catch (_) {}
      return saved;
    });
  };

  function enrichUserData(userData) {
    var placeholderVisitor = userData.ph === PLACEHOLDERS.ph || userData.em === PLACEHOLDERS.em;
    Object.keys(PLACEHOLDERS).forEach(function (key) {
      if (userData[key] === PLACEHOLDERS[key]) delete userData[key];
    });
    if (placeholderVisitor && userData.ge === PLACEHOLDER_GENDER) delete userData.ge;
    if (userData.st === PLACEHOLDER_STATE) delete userData.st;
    var id = anonymousId();
    if (id) userData.external_id = id;
    var fbc = currentFbc();
    if (fbc && !userData.fbc) userData.fbc = fbc;
    var fbp = readCookie('_fbp');
    if (fbp && !userData.fbp) userData.fbp = fbp;
    var customer = savedCustomer();
    ['ph', 'em', 'fn', 'ln'].forEach(function (key) {
      if (!userData[key] && customer[key]) userData[key] = customer[key];
    });
    if (!userData.country) userData.country = COUNTRY_BD;
    ['fbc', 'fbp'].forEach(function (key) {
      if (userData[key] === '') delete userData[key];
    });
    return userData;
  }
  window.__amolEnrichMetaUserData = enrichUserData;

  /* Checkout events carry this visitor's saved hashes for the Data Tags (and
     from there the server Meta tags). They are cleared straight after, because
     GA4's purchase tag sends user_data to Google as raw user-provided data. */
  var CHECKOUT_FIELDS = { ph: 'phone_number', em: 'email_address', fn: 'first_name', ln: 'last_name' };
  window.__amolPushWithCustomer = function (message) {
    window.dataLayer = window.dataLayer || [];
    var customer = savedCustomer();
    var userData = {};
    var added = [];
    Object.keys(CHECKOUT_FIELDS).forEach(function (key) {
      if (customer[key]) {
        userData[CHECKOUT_FIELDS[key]] = customer[key];
        added.push(CHECKOUT_FIELDS[key]);
      }
    });
    if (!added.length) {
      window.dataLayer.push(message);
      return;
    }
    userData.country = COUNTRY_BD;
    added.push('country');
    var id = anonymousId();
    if (id) userData.customer_id = id;
    message.user_data = userData;
    window.dataLayer.push(message);
    var cleared = {};
    added.forEach(function (name) { cleared[name] = undefined; });
    window.dataLayer.push({ user_data: cleared });
  };

  /* Installed first, so it runs last: it sees the final body just before sending. */
  var openRequest = XMLHttpRequest.prototype.open;
  var sendRequest = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    this.__amolMetaUrl = String(url || '');
    return openRequest.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function (body) {
    try {
      if (/\/gtag\/track-theme-/.test(this.__amolMetaUrl || '') && typeof body === 'string' && body.charAt(0) === '{') {
        var data = JSON.parse(body);
        data.user_data = enrichUserData(data.user_data && typeof data.user_data === 'object' ? data.user_data : {});
        arguments[0] = JSON.stringify(data);
      }
    } catch (_) { /* never block the request */ }
    return sendRequest.apply(this, arguments);
  };

  /* Browser pixel and Data Tags read user_data.customer_id as external ID. */
  window.dataLayer = window.dataLayer || [];
  var id = anonymousId();
  if (id) window.dataLayer.push({ user_data: { customer_id: id } });
})();
</script>
