/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4
   Editorial reading layout; preserve the storefront's green brand and routes. */
app-blog-details { --ab-blog-ink:#24332b; --ab-blog-accent:#175c36; display:block; color:var(--ab-blog-ink); }
app-blog-details .main-container { max-width:960px!important; margin:32px auto 64px!important; padding:0 24px!important; }
app-blog-details .bottom-section,app-blog-details .container { width:100%!important; max-width:100%!important; margin:0!important; padding:0!important; }
app-blog-details .main-container > .bottom-section:first-child img { width:100%!important; height:auto!important; max-height:340px; object-fit:contain; border-radius:8px; display:block; margin:0 auto 32px!important; }
app-blog-details .top-section { display:block!important; width:100%!important; max-width:760px; margin:0 auto 36px!important; padding:0 0 24px!important; border-bottom:1px solid #dce5de; text-align:left!important; }
app-blog-details .title h1 { font-family:'Noto Serif Bengali',serif!important; font-size:clamp(28px,3.2vw,40px)!important; font-weight:700!important; line-height:1.6!important; text-align:left!important; margin:0 0 16px!important; color:#173d29!important; }
app-blog-details .title h4,app-blog-details .date { font-size:15px!important; line-height:1.8!important; color:#59675e!important; margin:8px 0!important; }
app-blog-details .description { display:block!important; max-width:760px!important; margin:0 auto!important; font-family:'Noto Serif Bengali',serif!important; font-size:19px!important; font-weight:400!important; line-height:2!important; color:var(--ab-blog-ink)!important; text-align:left!important; overflow-wrap:anywhere; }
app-blog-details .description :is(p,li,strong,em,a,th,td,figcaption) { font-family:inherit!important; }
app-blog-details .description p,app-blog-details .description li { font:inherit!important; text-align:left!important; word-spacing:normal!important; line-height:2!important; margin:0 0 22px!important; }
app-blog-details .description h2 { font-family:inherit!important; font-size:27px!important; line-height:1.65!important; color:#173d29!important; margin:44px 0 20px!important; font-weight:700!important; clear:both; }
app-blog-details .description h3 { font-family:inherit!important; font-size:22px!important; line-height:1.75!important; margin:32px 0 12px!important; font-weight:600!important; }
app-blog-details .description ul,app-blog-details .description ol { padding-left:28px!important; margin:20px 0 28px!important; }
app-blog-details .description a { color:var(--ab-blog-accent)!important; text-decoration:underline!important; text-underline-offset:5px; }
app-blog-details .description a:hover { color:#0b3e22!important; }
app-blog-details a:focus-visible { outline:3px solid #9b6d0b; outline-offset:4px; }
app-blog-details .description table { display:block; max-width:100%; overflow-x:auto; border-collapse:collapse; margin:24px 0 36px; font-size:17px; line-height:1.9; }
app-blog-details .description th,app-blog-details .description td { padding:14px 18px!important; border:1px solid #dce5de!important; vertical-align:top; text-align:left; min-width:145px; }
app-blog-details .description th { background:#edf4ee; font-weight:600; }
app-blog-details .ab-book-section { display:flex; align-items:flex-start; gap:28px; padding:36px 0; border-bottom:1px solid #dce5de; }
app-blog-details .ab-book-section h2 { margin-top:0!important; }
app-blog-details .ab-book-copy { flex:1; min-width:0; }
app-blog-details .ab-book-cover { flex:0 0 135px; margin:8px 0 0!important; text-align:center; }
app-blog-details .ab-book-cover img { width:135px!important; height:205px!important; object-fit:contain!important; display:block; margin:auto; }
app-blog-details .ab-book-cover figcaption { font-size:13px; line-height:1.7; color:#59675e; margin-top:12px; }
body:has(app-blog-details) #ab-sticky-product-actions { display:none!important; }
@media(max-width:600px) {
 app-blog-details .main-container { margin-top:20px!important; padding:0 20px!important; }
 app-blog-details .description { font-size:18px!important; line-height:2!important; }
 app-blog-details .description h2 { font-size:24px!important; }
 app-blog-details .description h3 { font-size:21px!important; }
 app-blog-details .ab-book-section { flex-direction:column; gap:24px; padding:32px 0; }
 app-blog-details .ab-book-cover { flex-basis:auto; align-self:center; }
 app-blog-details .ab-book-cover img { width:140px!important; height:210px!important; }
 app-blog-details .description th,app-blog-details .description td { padding:12px!important; min-width:125px; }
}

/* Hallmark · component: blog card · genre: editorial · theme: existing Amol green
 * pre-emit critique: P5 H5 E4 S5 R5 V4 · component scope, no page restructuring
 * states: default, hover, focus, active; existing disabled/busy/error/success hooks respected
 */
app-blog-card-one {
 --ab-blog-card-paper: oklch(100% 0 0);
 --ab-blog-card-ink: oklch(27% 0.025 155);
 --ab-blog-card-muted: oklch(46% 0.018 155);
 --ab-blog-card-rule: oklch(88% 0.012 155);
 --ab-blog-card-accent: oklch(40% 0.09 155);
 --ab-blog-card-soft: oklch(97% 0.01 155);
 --ab-blog-card-error: oklch(46% 0.16 25);
 --ab-blog-card-clear: transparent;
 --ab-blog-card-title: 'Noto Serif Bengali',serif;
 --ab-blog-card-body: hind-siliguri,'Hind Siliguri',sans-serif;
 display:block; min-width:0; width:100%; max-width:760px; margin-inline:auto;
}
app-blog-card-one article.blog-card {
 display:flex!important; flex-direction:column; min-width:0; height:100%; padding:0!important;
 overflow:hidden; border:1px solid var(--ab-blog-card-rule)!important; border-radius:12px!important;
 background:var(--ab-blog-card-paper)!important; color:var(--ab-blog-card-ink)!important;
 box-shadow:none!important; transform:none!important; animation:none!important; transition:none!important;
}
app-blog-card-one .blog-card::before,app-blog-card-one .blog-card::after,
app-blog-card-one .blog-card__image-overlay::before,app-blog-card-one .blog-card__image-overlay::after,
app-blog-card-one .blog-card__content::before,app-blog-card-one .blog-card__read-more::before,
app-blog-card-one .blog-card__read-more::after { display:none!important; }
app-blog-card-one .blog-card__image-container { position:relative; aspect-ratio:12/5; height:auto!important; margin:0!important; border:0!important; border-radius:0!important; background:var(--ab-blog-card-soft)!important; overflow:hidden; }
app-blog-card-one .blog-card__image-overlay { height:100%!important; padding:0!important; background:none!important; }
app-blog-card-one img.blog-card__image { display:block; width:100%!important; height:100%!important; object-fit:cover!important; border-radius:0!important; transform:none!important; filter:none!important; transition:none!important; }
app-blog-card-one .blog-card__category-badge { display:none!important; }
app-blog-card-one .blog-card__content { display:flex!important; flex:1; flex-direction:column; gap:20px; padding:24px!important; background:var(--ab-blog-card-paper)!important; }
app-blog-card-one .blog-card__meta { display:flex!important; flex-direction:row!important; flex-wrap:nowrap!important; align-items:center; justify-content:space-between; gap:16px; margin:0!important; padding:0!important; border:0!important; font:400 14px/1.5 var(--ab-blog-card-body)!important; }
app-blog-card-one .blog-card__author,app-blog-card-one .blog-card__views { display:flex!important; align-items:center; gap:8px; padding:0!important; margin:0!important; border:0!important; border-radius:0!important; background:none!important; box-shadow:none!important; color:var(--ab-blog-card-muted)!important; }
app-blog-card-one .blog-card__views::after { content:'বার পড়া হয়েছে'; white-space:nowrap; }
app-blog-card-one .blog-card__meta i { display:none!important; }
app-blog-card-one .blog-card__title { margin:0!important; padding:0!important; border:0!important; }
app-blog-card-one .blog-card__title h3 { min-width:0; margin:0!important; color:var(--ab-blog-card-ink)!important; font-family:var(--ab-blog-card-title)!important; font-size:clamp(22px,2.4vw,29px)!important; font-weight:700!important; line-height:1.7!important; letter-spacing:0!important; overflow-wrap:anywhere; display:block!important; -webkit-line-clamp:unset!important; text-shadow:none!important; }
app-blog-card-one .blog-card__footer { margin-top:auto!important; padding-top:16px!important; border-top:1px solid var(--ab-blog-card-rule)!important; display:flex; justify-content:flex-start!important; }
app-blog-card-one a.blog-card__read-more { display:inline-flex!important; align-items:center; justify-content:center; gap:12px; min-height:44px; margin:0!important; align-self:flex-start; flex:0 0 auto!important; width:max-content!important; max-width:100%; padding:0!important; border:0!important; border-radius:0!important; background:none!important; color:var(--ab-blog-card-accent)!important; font:600 17px/1.5 var(--ab-blog-card-body)!important; box-shadow:none!important; text-shadow:none!important; white-space:nowrap; transform:none!important; transition:none!important; text-decoration:none!important; }
app-blog-card-one .blog-card__read-more i { color:inherit!important; transform:none!important; }
app-blog-card-one .blog-card__read-more i::before { content:'→'!important; font-family:var(--ab-blog-card-body)!important; font-size:20px; }
app-blog-card-one article.blog-card:focus-visible { outline:3px solid var(--ab-blog-card-accent)!important; outline-offset:4px; }
app-blog-card-one .blog-card__read-more:focus-visible { outline:3px solid var(--ab-blog-card-accent)!important; outline-offset:4px; }
app-blog-card-one .blog-card__read-more:active { color:var(--ab-blog-card-ink)!important; }
app-blog-card-one .blog-card__read-more[aria-disabled="true"] { opacity:.5; cursor:not-allowed; pointer-events:none; }
app-blog-card-one article.blog-card[aria-busy="true"] { opacity:.7; cursor:progress; }
app-blog-card-one article.blog-card[data-state="error"] { border-color:var(--ab-blog-card-error)!important; }
app-blog-card-one article.blog-card[data-state="success"] { border-color:var(--ab-blog-card-accent)!important; }
@media(hover:hover) {
 app-blog-card-one article.blog-card:hover { border-color:var(--ab-blog-card-accent)!important; }
 app-blog-card-one .blog-card__read-more:hover { text-decoration:underline!important; text-underline-offset:5px; }
}
@media(max-width:375px) {
 app-blog-card-one .blog-card__content { padding:20px!important; gap:16px; }
 app-blog-card-one .blog-card__title h3 { font-size:22px!important; }
}

</style>
<script>

(function () {
  if (window.__amolBlogMenu) return;
  window.__amolBlogMenu = true;
  function addBlogLink() {
    var menu = document.querySelector('app-header ul.nav-list');
    if (!menu || menu.querySelector('a[href="/blogs"]')) return;
    var item = document.createElement('li');
    item.className = 'nav-item';
    var link = document.createElement('a');
    link.className = 'nav-link';
    link.href = '/blogs';
    link.textContent = 'ব্লগ';
    Array.prototype.forEach.call(menu.attributes, function (attribute) {
      if (attribute.name.indexOf('_ngcontent-') !== 0) return;
      item.setAttribute(attribute.name, '');
      link.setAttribute(attribute.name, '');
    });
    item.appendChild(link);
    menu.appendChild(item);
  }
  function watchHeader() {
    var header = document.querySelector('app-header');
    if (!header) return false;
    addBlogLink();
    new MutationObserver(addBlogLink).observe(header, { childList:true, subtree:true });
    return true;
  }
  if (!watchHeader()) {
    var ready = new MutationObserver(function () {
      if (watchHeader()) ready.disconnect();
    });
    ready.observe(document.documentElement, { childList:true, subtree:true });
  }
}());
</script>
