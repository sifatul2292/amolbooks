<!-- All Pages. Feeds the existing GTM tags for search, remove_from_cart, add_shipping_info and add_payment_info. No API calls; cart data comes from the injected tracking script and localStorage. -->
<script>
(function () {
  if (window.__amolCommerceEvents) return;
  window.__amolCommerceEvents = true;

  var CART_PREFIX = 'Amolbooks_USER_CART_';
  var TOKEN_KEYS = ['Amolbooks_TOKEN_1', 'ALAMBOOKS_TOKEN_1', 'Amolbooks_USER_1_1', 'ALAMBOOKS_USER_1_1'];
  var CART_AREAS = 'app-cart, app-checkout, .cart-slide, .cart-slide-bottom, #ab-sticky-commerce';
  var DELIVERY = 'app-checkout #ab-checkout-delivery-card input:checked, app-checkout mat-radio-group[formcontrolname="deliveryOptions"] input:checked';
  var PAYMENT = 'app-checkout mat-radio-group[formcontrolname="paymentMethod"] input:checked';
  var PAYMENT_TYPES = { cash_on_delivery: 'Cash on Delivery', online_payment: 'Online Payment' };
  // Cart decreases count as removals only shortly after a tap on a cart control,
  // so order placement, login merges and other tabs do not look like removals.
  var REMOVAL_WINDOW_MS = 8000;

  function push(event, ecommerce, withCustomer) {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ ecommerce: null });
    var message = {
      event: event,
      ecommerce: ecommerce,
      event_id: 'amol_' + event + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      __stape: true
    };
    // The checkout's typed details, hashed, for the Data Tag and Meta tags.
    if (withCustomer && typeof window.__amolPushWithCustomer === 'function') window.__amolPushWithCustomer(message);
    else window.dataLayer.push(message);
  }

  function tracking() {
    return window.__amolTracking || null;
  }

  function trackingItems() {
    try { return tracking() ? tracking().cartItems() : []; } catch (_) { return []; }
  }

  function cartValue(items) {
    return items.reduce(function (total, item) {
      return total + (Number(item.price) || 0) * (Number(item.quantity) || 1);
    }, 0);
  }

  function cartEcommerce(extra) {
    var items = trackingItems();
    var ecommerce = { currency: 'BDT', value: cartValue(items), items: items };
    Object.keys(extra).forEach(function (key) { ecommerce[key] = extra[key]; });
    return ecommerce;
  }

  /* Search: native and custom header searches both land on /product-list?searchQuery=. */
  var lastSearchHref = '';
  function trackSearch() {
    if (location.pathname !== '/product-list' || location.href === lastSearchHref) return;
    lastSearchHref = location.href;
    var term = '';
    try { term = String(new URLSearchParams(location.search).get('searchQuery') || '').trim(); } catch (_) {}
    if (!term) return;
    try {
      if (sessionStorage.getItem('ab_search_tracked') === location.href) return;
      sessionStorage.setItem('ab_search_tracked', location.href);
    } catch (_) {}
    push('search_submitted_stape', { search_term: term });
  }

  /* Cart removals: guests keep the cart in localStorage, signed-in carts come from the cart API. */
  var serverCart = null;
  var knownItems = {};
  var previousCart = null;
  var previousSignedIn = null;
  var lastCartTapAt = 0;

  function signedIn() {
    try {
      return TOKEN_KEYS.some(function (key) { return !!localStorage.getItem(key); });
    } catch (_) {
      return false;
    }
  }

  function storedCart() {
    try {
      var keys = Object.keys(localStorage);
      for (var index = 0; index < keys.length; index += 1) {
        if (keys[index].indexOf(CART_PREFIX) !== 0) continue;
        var lines = JSON.parse(localStorage.getItem(keys[index]));
        if (Array.isArray(lines)) return lines;
      }
    } catch (_) {}
    return [];
  }

  function lineId(line) {
    var ref = line && (line.product || line.specialPackage);
    return String(ref && typeof ref === 'object' ? ref._id || '' : ref || '');
  }

  function rememberItem(id, name, price) {
    if (!id || !(Number(price) > 0)) return;
    knownItems[id] = { item_id: id, item_name: name || (knownItems[id] && knownItems[id].item_name) || '', price: Number(price) };
  }

  function rememberServerLines(lines) {
    lines.forEach(function (line) {
      var product = line && typeof line.product === 'object' ? line.product : null;
      if (!product || !tracking()) return;
      rememberItem(lineId(line), product.name, tracking().finalPrice(product));
    });
  }

  function cartQuantities() {
    var lines = signedIn() ? serverCart : storedCart();
    if (!lines) return null;
    var quantities = {};
    lines.forEach(function (line) {
      var id = lineId(line);
      if (id) quantities[id] = (quantities[id] || 0) + (Number(line.selectedQty) || 1);
    });
    return quantities;
  }

  function removedItem(id, quantity) {
    var known = knownItems[id];
    var price = known ? known.price : (tracking() && tracking().priceOf(id)) || 0;
    return { item_id: id, item_name: known ? known.item_name : '', price: price, quantity: quantity };
  }

  function checkCart() {
    trackingItems().forEach(function (item) { rememberItem(String(item.item_id || ''), item.item_name, item.price); });
    var current = cartQuantities();
    var auth = signedIn();
    if (!current) return;
    if (previousCart && previousSignedIn === auth && Date.now() - lastCartTapAt < REMOVAL_WINDOW_MS &&
        location.pathname.indexOf('order-success') === -1) {
      var removed = [];
      Object.keys(previousCart).forEach(function (id) {
        var quantity = previousCart[id] - (current[id] || 0);
        if (quantity > 0) removed.push(removedItem(id, quantity));
      });
      if (removed.length) push('remove_from_cart_stape', { currency: 'BDT', value: cartValue(removed), items: removed });
    }
    previousCart = current;
    previousSignedIn = auth;
  }

  var openRequest = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    if (/\/cart\/get-carts-by-user/.test(String(url || ''))) {
      this.addEventListener('load', function () {
        try {
          var body = typeof this.response === 'object' && this.response ? this.response : JSON.parse(this.responseText);
          if (!body || !Array.isArray(body.data)) return;
          serverCart = body.data;
          rememberServerLines(serverCart);
          checkCart();
        } catch (_) {}
      });
    }
    return openRequest.apply(this, arguments);
  };

  /* Checkout: shipping once the delivery details are complete, payment on order confirmation. */
  var checkoutActive = false;
  var shippingTracked = false;
  var paymentTracked = false;
  var shippingTimer = 0;

  function field(name) {
    var input = document.querySelector('app-checkout [formcontrolname="' + name + '"]');
    return input && 'value' in input ? String(input.value || '').trim() : '';
  }

  function asciiDigits(text) {
    return String(text || '').replace(/[০-৯]/g, function (digit) { return String('০১২৩৪৫৬৭৮৯'.indexOf(digit)); }).replace(/\D/g, '');
  }

  function checkedLabel(selector) {
    var input = document.querySelector(selector);
    if (!input) return '';
    var option = input.closest('mat-radio-button, .mat-mdc-radio-button');
    return String(option ? option.textContent : input.value).replace(/\s+/g, ' ').trim();
  }

  function shippingComplete() {
    return field('name').length >= 2 &&
      /^(?:88)?01[3-9]\d{8}$/.test(asciiDigits(field('phoneNo'))) &&
      field('address').length >= 5 &&
      !!document.querySelector(DELIVERY);
  }

  /* Hand the typed details to meta-match-data.html, which keeps only hashes,
     so this visitor's later Meta events can be matched. */
  function rememberCustomer() {
    if (typeof window.__amolRememberMetaCustomer !== 'function') return Promise.resolve();
    var email = document.getElementById('ab-email-input');
    return window.__amolRememberMetaCustomer({ name: field('name'), phone: field('phoneNo'), email: email ? email.value : '' })
      .catch(function () {});
  }

  function trackShipping() {
    if (location.pathname !== '/checkout' || !shippingComplete()) return;
    rememberCustomer();
    if (shippingTracked) return;
    var ecommerce = cartEcommerce({ shipping_tier: checkedLabel(DELIVERY) });
    if (!ecommerce.items.length) return;
    shippingTracked = true;
    push('add_shipping_info_stape', ecommerce);
  }

  function trackPayment() {
    if (location.pathname !== '/checkout' || !shippingComplete()) return;
    var remembered = rememberCustomer();
    if (paymentTracked) return;
    var method = document.querySelector(PAYMENT);
    var value = method ? method.value : 'cash_on_delivery';
    var ecommerce = cartEcommerce({ payment_type: PAYMENT_TYPES[value] || value });
    if (!ecommerce.items.length) return;
    paymentTracked = true;
    remembered.then(function () { push('add_payment_info_stape', ecommerce, true); });
  }

  function isConfirmOrder(element) {
    return !!element && /অর্ডার কনফার্ম/.test(element.textContent || '');
  }

  document.addEventListener('click', function (event) {
    var target = event.target && event.target.closest ? event.target : null;
    var control = target && target.closest('button, a, [role="button"], i, .q-icon');
    if (!control) return;
    if (isConfirmOrder(control) && control.closest('app-checkout')) {
      trackShipping();
      trackPayment();
      return;
    }
    if (control.closest(CART_AREAS)) lastCartTapAt = Date.now();
  }, true);

  function scheduleShipping(event) {
    if (!event.target || !event.target.closest || !event.target.closest('app-checkout')) return;
    window.clearTimeout(shippingTimer);
    shippingTimer = window.setTimeout(trackShipping, 300);
  }
  document.addEventListener('focusout', scheduleShipping, true);
  document.addEventListener('change', scheduleShipping, true);

  function tick() {
    var onCheckout = location.pathname === '/checkout';
    if (onCheckout && !checkoutActive) {
      shippingTracked = false;
      paymentTracked = false;
    }
    checkoutActive = onCheckout;
    trackSearch();
    checkCart();
  }
  window.setInterval(tick, 700);
  tick();
})();
</script>
