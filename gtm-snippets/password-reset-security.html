<!-- Load before Angular: carry the backend reset proof through the compiled recovery form. -->
<script>
(function () {
  'use strict';
  if (window.__abPasswordResetSecurity || !window.XMLHttpRequest) return;
  window.__abPasswordResetSecurity = true;
  var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var API_BASE = local ? location.origin + '/api' : 'https://apisub.amolbooks.com/api';
  var api = new URL(API_BASE);
  var proofs = Object.create(null);
  var open = XMLHttpRequest.prototype.open;
  var send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    var result = open.apply(this, arguments);
    var target = new URL(url, location.href);
    var allowed = target.origin === api.origin;
    // The compiled localhost bundle may still call the production API.
    if (local && target.origin === 'https://apisub.amolbooks.com') allowed = true;
    var request = { origin: target.origin, path: target.pathname, method: String(method).toUpperCase() };
    this.__abResetRequest = allowed ? request : null;
    if (allowed && request.method === 'POST' &&
        /^\/api\/otp\/validate-otp(?:-with-email)?$/.test(request.path)) {
      this.addEventListener('load', function () {
        try {
          var response = this.responseType === 'json' ? this.response : JSON.parse(this.responseText);
          if (this.status >= 200 && this.status < 300 && response.success &&
              response.data && /^[a-f0-9]{64}$/.test(response.data.resetToken)) {
            proofs[request.origin + '\n' + request.identity] = {
              token: response.data.resetToken, expires: Date.now() + 5 * 60 * 1000
            };
          }
        } catch (_error) {}
      }, { once: true, capture: true });
    }
    return result;
  };
  XMLHttpRequest.prototype.send = function (body) {
    var request = this.__abResetRequest;
    try {
      if (request && typeof body === 'string') {
        var data = JSON.parse(body);
        if (request.method === 'POST' && /^\/api\/otp\/validate-otp(?:-with-email)?$/.test(request.path)) {
          request.identity = request.path.endsWith('-with-email') ? data.email : data.phoneNo;
        }
        if (request.method === 'PUT' && request.path === '/api/user/reset-user-password') {
          var key = request.origin + '\n' + data.username;
          var proof = proofs[key];
          if (proof && proof.expires > Date.now()) {
            data.resetToken = proof.token;
            body = JSON.stringify(data);
          }
          delete proofs[key];
        }
      }
    } catch (_error) {}
    return send.call(this, body);
  };
})();
</script>
