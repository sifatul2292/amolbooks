<!-- All Pages. Presentation only; no API_BASE or analytics changes. -->
<style id="ab-pagespeed-runtime">
@font-face {
  font-family: hind-siliguri;
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url('https://apisub.amolbooks.com/api/storefront-assets/hind-siliguri-regular.3bbbe5e258da.woff2') format('woff2');
}
/* Match the existing Font Awesome faces while avoiding invisible icons during loading. */
@font-face {
  font-family: 'Font Awesome 6 Free';
  font-style: normal;
  font-weight: 900;
  font-display: swap;
  src: url('https://apisub.amolbooks.com/api/storefront-assets/font-awesome-6-solid.73704f99ff43.woff2') format('woff2'), url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/webfonts/fa-solid-900.woff2') format('woff2');
  unicode-range: U+21,U+2B,U+F002,U+F004,U+F005,U+F007,U+F00C,U+F00D,U+F015,U+F02E,U+F036,U+F041,U+F04B,U+F057,U+F058,U+F061,U+F064,U+F068,U+F06B,U+F06E,U+F070,U+F078,U+F07A,U+F089,U+F08B,U+F09D,U+F0AC,U+F0C9,U+F0CA,U+F0D7,U+F0EE,U+F0F3,U+F104,U+F105,U+F106,U+F107,U+F10D,U+F110,U+F126,U+F133,U+F1B9,U+F1E0,U+F1F8,U+F274,U+F290,U+F291,U+F2BD,U+F2ED,U+F5C0,U+F879;
}
@font-face {
  font-family: 'Font Awesome 6 Brands';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('https://apisub.amolbooks.com/api/storefront-assets/font-awesome-6-brands.7be3a540b68b.woff2') format('woff2'), url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/webfonts/fa-brands-400.woff2') format('woff2');
  unicode-range: U+21,U+2B,U+E07B,U+F08C,U+F099,U+F09A,U+F0D2,U+F0E1,U+F167,U+F16D,U+F1A0,U+F232,U+F2C6,U+F39E;
}
/* Keep drawer/hover state changes; animate only compositor-supported properties. */
app-header header,
app-header .header-main,
app-header .nav-link,
app-header .side-nav,
app-header .category-slide,
app-footer .footer-link a,
app-footer .footer-social a {
  transition-property: transform, opacity !important;
}
@media (prefers-reduced-motion: reduce) {
  .ab-header-ticker-track,
  .cart-icon-bounce,
  .cart-icon-loop { animation: none !important; }
}
</style>

<script>
(function () {
  if (window.__amolPerformanceStyles) return;
  window.__amolPerformanceStyles = true;
  // The legacy Font Awesome stylesheet arrives after load; keep the swap
  // declarations after it so its original font-display:auto does not win.
  function tuneLogos(root) {
    if (!root.querySelectorAll) return;
    var images = root.tagName === 'IMG' ? [root] : root.querySelectorAll('app-header .logo img');
    Array.prototype.forEach.call(images, function (image) {
      if (image.hasAttribute('data-ab-responsive-logo') || !image.closest('app-header .logo')) return;
      var url;
      try { url = new URL(image.getAttribute('src') || '', location.href); } catch (_) { return; }
      if (url.origin !== 'https://apisub.amolbooks.com' || !/^\/api\/upload\/images\/amolbook-logo-removebg-preview-[^/]+\.png$/.test(url.pathname)) return;
      var file = url.pathname.split('/').pop();
      var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      var base = (local ? location.origin : url.origin) + '/api/storefront-images/';
      image.setAttribute('data-ab-responsive-logo', 'true');
      image.setAttribute('sizes', '140px');
      image.setAttribute('srcset', base + '160/' + file + ' 160w, ' + base + '320/' + file + ' 320w');
    });
  }
  document.addEventListener('error', function (event) {
    var image = event.target;
    if (image && image.tagName === 'IMG' && image.hasAttribute('data-ab-responsive-logo') && image.hasAttribute('srcset')) {
      event.stopImmediatePropagation();
      image.removeAttribute('srcset');
    }
  }, true);
  new MutationObserver(function (records) {
    records.forEach(function (record) {
      Array.prototype.forEach.call(record.addedNodes || [], tuneLogos);
    });
  }).observe(document.documentElement, { childList: true, subtree: true });
  tuneLogos(document);
  function keepFontStylesLast() {
    var style = document.getElementById('ab-pagespeed-runtime');
    if (style && document.head.lastElementChild !== style) document.head.appendChild(style);
  }
  new MutationObserver(function (records) {
    records.forEach(function (record) {
      Array.prototype.forEach.call(record.addedNodes || [], function (node) {
        if (node.tagName === 'LINK' && /font-awesome\/6\.2\.0\/css\/all\.min\.css/.test(node.href || '')) keepFontStylesLast();
      });
    });
  }).observe(document.head, { childList: true });
  document.addEventListener('load', function (event) {
    var link = event.target;
    if (!link || link.tagName !== 'LINK' || !/font-awesome\/6\.2\.0\/css\/all\.min\.css/.test(link.href)) return;
    keepFontStylesLast();
  }, true);
})();
</script>
