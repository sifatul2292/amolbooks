<script>
(function(){

   saveCartState(state);
  }).catch(function(){notice='কার্টের তথ্য পড়া যায়নি। আবার চেষ্টা করুন।';}).finally(function(){syncing=false;update();});
 }

 function active(){return location.pathname==='/product-list'&&new URLSearchParams(location.search).get('collection')==='abdullah-jahangir';}

 function bookHtml(book,index){

rong data-aj-total></strong></div><button class="aj-primary" data-aj-buy type="button">বইগুলো কিনুন →</button><p class="aj-status" role="status" aria-live="polite"></p></div>';

 function update(){
