<!-- Checkout: "order updates come on WhatsApp" under the phone box, shown only while the shop's automatic WhatsApp order messages are switched on (GET /api/whatsapp/public-status; api/src/shared/whatsapp). Meta expects customers to be told before business messages are sent. -->
<style>
  .ab-whatsapp-note { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 16px; padding: 8px 10px; border-radius: 8px; background: #edf7ef; color: #1f5131; font: 500 14px/1.5 hind-siliguri, system-ui, sans-serif; }
  .ab-whatsapp-note svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 2px; fill: #1f8f4a; }
</style>
<script>
(function () {
  'use strict';
  if (window.__abCheckoutWhatsappNote) return;
  window.__abCheckoutWhatsappNote = true;

  var FIELD = 'app-checkout input[formcontrolname="phoneNo"]';
  var CACHE_KEY = 'ab-whatsapp-status-v1';
  var local = /^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(location.hostname);
  var sameOrigin = local || /^(www\.)?amolbooks\.com$/.test(location.hostname);
  var API = (sameOrigin ? location.origin : 'https://apisub.amolbooks.com') + '/api/whatsapp/public-status';
  var TEXT = 'অর্ডারের আপডেট এই নম্বরের WhatsApp-এ পাঠানো হবে।';
  var ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
  var enabled = null;
  var asked = false;

  // Asked once, and only on the checkout page.
  function loadStatus() {
    asked = true;
    try {
      var cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
      if (cached && Date.now() - cached.at < 10 * 60 * 1000) { enabled = !!cached.on; return; }
    } catch (error) { /* Ask the server when storage is unavailable. */ }
    fetch(API, { credentials: 'omit', headers: { Accept: 'application/json' } })
      .then(function (response) { return response.ok ? response.json() : null; })
      .then(function (result) {
        enabled = !!(result && result.data && result.data.orderMessages);
        try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ on: enabled, at: Date.now() })); } catch (error) { /* Cache is optional. */ }
        place();
      })
      .catch(function () { enabled = false; });
  }

  function place() {
    if (!/^\/checkout/.test(location.pathname)) return;
    if (!asked) loadStatus();
    if (!enabled) return;
    var input = document.querySelector(FIELD);
    if (!input) return;
    var form = input.closest('form') || document;
    if (form.querySelector('.ab-whatsapp-note')) return;
    var note = document.createElement('p');
    note.className = 'ab-whatsapp-note';
    note.innerHTML = ICON + '<span>' + TEXT + '</span>';
    // After the whole Material field (its outline and error line), not inside it.
    (input.closest('mat-form-field') || input).insertAdjacentElement('afterend', note);
  }

  var scheduled = false;
  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(function () { scheduled = false; place(); });
  }
  schedule();
  new MutationObserver(function () { if (/^\/checkout/.test(location.pathname)) schedule(); })
    .observe(document.documentElement, { childList: true, subtree: true });
}());
</script>
