<script>
(function () {
  'use strict';
  if (window.__abHeaderV2) return;
  window.__abHeaderV2 = true;

  // Narrow screens: when the current page's tab is off to the right (e.g. ব্লগ), scroll the menu to it.
  function revealActiveTab() {
    var list = document.querySelector('app-header .nav-list');
    var active = list && list.querySelector('.nav-link.active');
    if (!active || list.scrollWidth <= list.clientWidth) return;
    var item = active.closest('.nav-item') || active;
    var start = list.scrollLeft;
    if (item.offsetLeft < start || item.offsetLeft + item.offsetWidth > start + list.clientWidth - 30) {
      list.scrollLeft = Math.max(0, item.offsetLeft - 10);
    }
  }

  // The menu is drawn after this runs, and pages change without a reload.
  var lastRoute = '';
  window.setInterval(function () {
    var route = location.pathname + location.search;
    if (route === lastRoute) return;
    lastRoute = route;
    window.setTimeout(revealActiveTab, 400);
    window.setTimeout(revealActiveTab, 1500);
  }, 700);
})();
</script>
