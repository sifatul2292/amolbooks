<script>
(function () {
 'use strict';
 if (window.__amolGiftCheckout) return;
 window.__amolGiftCheckout = true;
 var local=/^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(location.hostname)||/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)||/\.trycloudflare\.com$/.test(location.hostname);
 var API_BASE=local?location.origin+'/api':'https://apisub.amolbooks.com/api';
 var KEY='amol_gift_checkout_v1', WRAP_FEE=30, draft={}, component=null;
 try { draft=JSON.parse(sessionStorage.getItem(KEY)||'{}')||{}; } catch (_) {}
 if(typeof draft!=='object'||Array.isArray(draft)) draft={};
 if(!draft.recipient||typeof draft.recipient!=='object') draft.recipient={};
 function giftMode(){return /^\/checkout\/?$/.test(location.pathname)&&new URLSearchParams(location.search).get('gift')==='1';}
 function checkoutOpen(){return /^\/checkout\/?$/.test(location.pathname);}
 function save(){try{sessionStorage.setItem(KEY,JSON.stringify(draft));}catch(_){}}
 function fee(){return giftMode()&&draft.wrap===true?WRAP_FEE:0;}
 function money(value){return '৳'+Math.max(0,Number(value)||0).toLocaleString('en-US',{maximumFractionDigits:2});}
 function setText(node,value){if(node&&node.textContent!==value)node.textContent=value;}
 function rules(){return window.AbDeliveryZone;}
 var rulesLoading=false;
 function loadRules(){
  if(rules()||rulesLoading||!giftMode())return;
  rulesLoading=true;
  var script=document.createElement('script');
  script.src=API_BASE+'/storefront-assets/delivery-zone-core.js';
  script.onload=schedule;
  document.head.appendChild(script);
 }
 function syncPayment(value){
  if(!giftMode()||!value.formData)return;
  var control=value.formData.get('paymentMethod');
  if(control&&control.value!=='online_payment')control.setValue('online_payment');
  value.selectedPaymentMethod='online_payment';
 }
 // Angular reads delivery totals repeatedly; detect only when the address or rules change.
 var detectedAddress, detectedRules, detectedLocation={};
 function recipientLocation(){
  var Z=rules(), address=String(draft.recipient.address||'');
  if(address!==detectedAddress||Z!==detectedRules){
   detectedAddress=address;detectedRules=Z;detectedLocation=Z&&Z.detect(address)||{};
  }
  return detectedLocation;
 }
 function applyRecipient(value){
  if(!giftMode()||!value.formData)return;
  ['name','phoneNo','alternativePhoneNo','country','address'].forEach(function(key){
   var control=value.formData.get(key), next=key==='country'?'bangladesh':key==='alternativePhoneNo'?'':draft.recipient[key]||'';
   if(control&&control.value!==next)control.setValue(next);
  });
  var location=recipientLocation(), Z=rules();
  if(Z&&Z.zoneFor(location.district,location.area)){
   var delivery=value.formData.get('deliveryOptions'), selected=Z.zoneFor(location.district,location.area)==='inside'?'1':'2';
   if(delivery&&delivery.value!==selected)delivery.setValue(selected);
  }
 }
 function validateGift(){
  var fields=document.querySelectorAll('#ab-gift-sender input,#ab-gift-recipient input,#ab-gift-recipient textarea,#ab-gift-recipient select');
  if(!fields.length)return false;
  for(var i=0;i<fields.length;i++){
   if(fields[i].required&&fields[i].setCustomValidity)fields[i].setCustomValidity(fields[i].value.trim()?'':'Please complete this field.');
   if(!fields[i].reportValidity())return false;
  }
  return true;
 }
 function patchCheckout(proto){
  if(Object.prototype.hasOwnProperty.call(proto,'__abGiftPatched'))return;
  var total=Object.getOwnPropertyDescriptor(proto,'grandTotal');
  if(!total||!total.get||typeof proto.addOrder!=='function')return;
  Object.defineProperty(proto,'__abGiftPatched',{value:true});
  Object.defineProperty(proto,'grandTotal',{configurable:true,get:function(){return total.get.call(this)+fee();}});
  var delivery=proto.calculateDeliveryCharge;
  proto.calculateDeliveryCharge=function(){
   var Z=rules(), location=recipientLocation(), zone=Z&&Z.zoneFor(location.district,location.area);
   if(giftMode()&&zone&&this.shippingCharge)return Z.chargeFor(zone,this.totalWeight,this.shippingCharge,this.cartSubTotal-this.cartDiscountAmount);
   return delivery.apply(this,arguments);
  };
  var init=proto.initForm;
  proto.initForm=function(){
   var result=init.apply(this,arguments);component=this;this.__abGiftZone=window.Zone&&window.Zone.current;
   applyRecipient(this);syncPayment(this);schedule();return result;
  };
  var confirm=proto.onConfirmOrder;
  proto.onConfirmOrder=function(){
   if(giftMode()&&this.isSubmittingOrder)return;
   if(giftMode()&&!validateGift())return;
   applyRecipient(this);syncPayment(this);return confirm.apply(this,arguments);
  };
  var add=proto.addOrder;
  proto.addOrder=function(data){
   if(giftMode()&&!validateGift())return;
   syncPayment(this);
   data=Object.assign({},data,{isGiftOrder:giftMode(),giftWrap:giftMode()&&draft.wrap===true});
   if(giftMode()){
    data.paymentType='online_payment';
    data.gift={senderName:(draft.senderName||'').trim(),senderPhone:(draft.senderPhone||'').trim(),message:draft.message||''};
   }
   return add.call(this,data);
  };
  var loggedIn=proto.getLoggedInUserData;
  proto.getLoggedInUserData=function(){
   if(!giftMode())return loggedIn.apply(this,arguments);
   var self=this;
   this.subDataOne=this.userDataService.getLoggedInUserData('name addresses email phoneNo username').subscribe(function(response){
    self.user=response.data;
    if(!draft.senderName)draft.senderName=self.user&&self.user.name||'';
    if(!draft.senderPhone)draft.senderPhone=self.user&&self.user.phoneNo||'';
    save();schedule();
   },function(error){console.log(error);});
  };
 }
 var patches=window.__amolCheckoutPatches=window.__amolCheckoutPatches||[];patches.push(patchCheckout);
 function section(id,html){var node=document.createElement('section');node.id=id;node.innerHTML=html;return node;}
 function wrapHtml(){return '<label class="ab-gift-wrap"><input type="checkbox" data-ab-gift-wrap><span class="ab-gift-wrap-copy"><span class="ab-gift-wrap-title">গিফট কভারে মুড়িয়ে দিন <strong class="ab-gift-wrap-price">+ ৳৩০</strong></span><span class="ab-gift-wrap-description">বইগুলো সুন্দর গিফট কভারে মুড়িয়ে প্রাপকের কাছে পাঠানো হবে।</span></span></label><small class="ab-gift-wrap-status ab-gift-sr" aria-live="polite"></small>'; }
 function caption(){return '<span aria-hidden="true">🎁</span> প্রিয়জনকে উপহার দিতে <strong>Gift Order</strong> ক্লিক করুন';}
 function renderCart(){
  var obsolete=document.getElementById('ab-gift-cart');if(obsolete)obsolete.remove();
  var footer=document.querySelector('app-cart-information .cart-area-bottom,app-cart .cart-area-bottom');
  if(!footer)return;
  var order=footer.querySelector('button.order,a[href*="/checkout"]:not([data-ab-gift-start])');if(!order)return;
  footer.classList.add('ab-gift-cart-footer');
  var buttons=footer.querySelector('.ab-gift-cart-buttons'),prompt=footer.querySelector('.ab-gift-cart-caption');
  if(!buttons){
   prompt=document.createElement('div');prompt.className='ab-gift-cart-caption';prompt.innerHTML=caption();
   buttons=document.createElement('div');buttons.className='ab-gift-cart-buttons';
   buttons.innerHTML='<a class="ab-gift-start" data-ab-gift-start href="/checkout?gift=1">Gift Order</a>';
   buttons.appendChild(order);
  }
  // Native and fallback footers share one action layout; retain the native button bindings.
  if(buttons.parentNode!==footer)footer.appendChild(buttons);
  if(prompt&&prompt.parentNode!==footer)footer.insertBefore(prompt,buttons);
  var more=footer.querySelector('[data-ab-cart-continue],button[routerlink="/product-list"],a[routerlink="/product-list"]');
  if(more&&more.parentNode!==footer)footer.insertBefore(more,prompt||buttons);
 }
 function field(label,attr,placeholder,extra){return '<label><span class="ab-gift-sr">'+label+'</span><input '+attr+' placeholder="'+placeholder+'" '+(extra||'')+'></label>';}
 function renderGiftForm(host,left){
  if(!host.querySelector('#ab-gift-sender'))left.insertBefore(section('ab-gift-sender','<h2>Gift From</h2><div class="ab-gift-sender-fields">'+field('Sender name','data-ab-gift-field="senderName"','Your Name','required maxlength="100" autocomplete="name"')+field('Sender phone','data-ab-gift-field="senderPhone"','Your Phone','required type="tel" inputmode="tel" pattern="(?:\\+?8801|01)[3-9][0-9]{8}" maxlength="20" autocomplete="tel"')+'</div>'),left.firstChild);
  var nativeAddress=host.querySelector('.address-form-area');
  if(!host.querySelector('#ab-gift-recipient')){
   var gift=section('ab-gift-recipient','<div class="ab-gift-letter"><h2>Gift To</h2><div class="ab-gift-recipient-fields">'+
    field('Recipient name','data-ab-gift-recipient="name"','Name','required maxlength="100" autocomplete="shipping name"')+
    field('Recipient phone','data-ab-gift-recipient="phoneNo"','Phone','required type="tel" inputmode="tel" pattern="(?:\\+?8801|01)[3-9][0-9]{8}" maxlength="20" autocomplete="shipping tel"')+
    '<label class="ab-gift-full"><span class="ab-gift-sr">Recipient address</span><textarea data-ab-gift-recipient="address" required maxlength="500" rows="3" autocomplete="shipping street-address" placeholder="বাসা/ফ্ল্যাট নম্বর, পাড়া-মহল্লার নাম, পরিচিতির এলাকা ও জেলার নাম উল্লেখ করুন"></textarea></label>'+
    '<label class="ab-gift-full"><span class="ab-gift-sr">Gift message</span><textarea data-ab-gift-field="message" maxlength="120" rows="3" placeholder="Gift Message" aria-describedby="ab-gift-remaining"></textarea></label></div><small id="ab-gift-remaining" aria-live="polite"></small><a href="/checkout" class="ab-gift-return" data-ab-gift-regular>সাধারণ অর্ডারে ফিরুন</a></div>');
   if(nativeAddress)nativeAddress.parentNode.insertBefore(gift,nativeAddress);else left.appendChild(gift);
  }
  host.querySelectorAll('[data-ab-gift-field],[data-ab-gift-recipient]').forEach(function(input){
   var recipient=input.getAttribute('data-ab-gift-recipient'),key=recipient||input.getAttribute('data-ab-gift-field');
   var value=String((recipient?draft.recipient[key]:draft[key])||(key==='country'?'bangladesh':''));
   if(input!==document.activeElement&&input.value!==value)input.value=value;
  });
  setText(host.querySelector('#ab-gift-remaining'),(120-String(draft.message||'').length)+' Character(s) Remaining');
 }
 function renderSummary(host){
  host.querySelectorAll('.summery-area').forEach(function(area){
   var native=area.querySelector('.summery-main')||area;
   var old=area.querySelector('.ab-gift-summary-wrap');if(old)old.remove();
   var roko=area.querySelector('.ab-gift-roko-summary');
   if(giftMode()){
    if(!roko){roko=document.createElement('section');roko.className='ab-gift-roko-summary';roko.innerHTML='<h2>Checkout Summary</h2><dl><div><dt>Subtotal</dt><dd data-ab-gift-sum="books"></dd></div><div><dt>Delivery Charge</dt><dd data-ab-gift-sum="delivery"></dd></div><div data-ab-gift-wrap-row hidden><dt>Gift Wrap</dt><dd data-ab-gift-sum="wrap"></dd></div><div><dt>Total</dt><dd data-ab-gift-sum="total"></dd></div><div class="ab-gift-payable"><dt>Payable Total</dt><dd data-ab-gift-sum="total"></dd></div></dl>'+wrapHtml();native.appendChild(roko);}
    if(!area.querySelector('.ab-gift-summary-action')){var action=document.createElement('div');action.className='ab-gift-summary-action';action.innerHTML='<button type="button" data-ab-gift-confirm data-ab-gift-inline>অর্ডার করুন</button>';native.appendChild(action);}
    roko.querySelector('[data-ab-gift-wrap-row]').hidden=!fee();
    if(component){
     var books=component.cartSubTotal-component.cartDiscountAmount-Number(component.couponDiscount||0)-Number(component.orderDiscountTotal||0);
     roko.querySelectorAll('[data-ab-gift-sum]').forEach(function(node){var key=node.getAttribute('data-ab-gift-sum');setText(node,money(key==='books'?books:key==='delivery'?component.calculateDeliveryCharge():key==='wrap'?fee():component.grandTotal));});
    }
   }else{
    if(roko)roko.remove();var action=area.querySelector('.ab-gift-summary-action');if(action)action.remove();
   }
  });
  host.querySelectorAll('.summery-list ul').forEach(function(list){
   var row=list.querySelector('.ab-gift-fee');
   if(fee()&&!row){row=document.createElement('li');row.className='ab-gift-fee';row.innerHTML='<span>Gift Wrap</span><strong>৳30</strong>';list.insertBefore(row,list.lastElementChild);}
   else if(!fee()&&row)row.remove();
  });
 }
 function renderCheckout(host){
  var form=host.querySelector('form');if(!form)return;
  var left=host.querySelector('.section-left')||form;
  if(giftMode()){
   loadRules();renderGiftForm(host,left);
   var mobileSummary=left.querySelector('.summery-area.summery-mbl'), paymentArea=left.querySelector('.payment-method-area');
   if(window.innerWidth<1024&&mobileSummary&&paymentArea&&(paymentArea.compareDocumentPosition(mobileSummary)&2))left.appendChild(mobileSummary);
   host.querySelectorAll('.payment-method-area .payment-method-top').forEach(function(heading){
    var next=heading.nextElementSibling;
    if((next&&next.classList.contains('radio-box-area'))||/ডেলিভারি|delivery charge/i.test(heading.textContent))heading.classList.add('ab-gift-delivery-heading');
    else if(next&&next.getAttribute('formcontrolname')==='paymentMethod'){var title=heading.querySelector('h4');if(title)setText(title,'Payment Method');}
   });
   host.querySelectorAll('.payment-method-card').forEach(function(card){if(card.querySelector('input[value="cash_on_delivery"]'))card.classList.add('ab-gift-cod');});
   var payment=host.querySelector('.payment-method-area');
   if(payment&&!payment.querySelector('.ab-gift-payment-note')){var note=document.createElement('p');note.className='ab-gift-payment-note';note.textContent='বিকাশ / নগদ / রকেট / কার্ড — পরের ধাপে EPS-এ মাধ্যম বেছে নিন।';payment.appendChild(note);}
   if(!document.getElementById('ab-gift-confirm-bar')){var bar=document.createElement('div');bar.id='ab-gift-confirm-bar';bar.innerHTML='<button type="button" data-ab-gift-confirm></button>';document.body.appendChild(bar);}
  }else{
   host.querySelectorAll('#ab-gift-sender,#ab-gift-recipient,.ab-gift-payment-note').forEach(function(node){node.remove();});
   host.querySelectorAll('.ab-gift-cod').forEach(function(node){node.classList.remove('ab-gift-cod');});
   var stale=document.getElementById('ab-gift-confirm-bar');if(stale)stale.remove();
  }
  renderSummary(host);if(component)syncPayment(component);
  if(giftMode()&&component){
   var submit=host.querySelector('.confirm-order button[type="submit"]');
   document.querySelectorAll('[data-ab-gift-confirm]').forEach(function(button){setText(button,button.hasAttribute('data-ab-gift-inline')?'অর্ডার করুন':'অর্ডার নিশ্চিত করুন '+money(component.grandTotal));button.disabled=Boolean(component.isSubmittingOrder||(submit&&submit.disabled));});
  }
 }
 function update(){
  if(!document.body)return;
  document.body.classList.toggle('ab-gift-checkout',giftMode());
  var active=document.activeElement;document.body.classList.toggle('ab-gift-typing',!!(giftMode()&&active&&active.closest('#ab-gift-sender,#ab-gift-recipient')&&active.matches('input,textarea')));
  if(location.pathname.indexOf('/checkout/order-success')===0){draft={recipient:{}};try{sessionStorage.removeItem(KEY);}catch(_){}}
  if(location.pathname==='/cart'){
   renderCart();var sticky=document.querySelector('#ab-cart-sticky-checkout');
   if(sticky&&!sticky.querySelector('[data-ab-gift-start]')){
    var prompt=document.createElement('div');prompt.className='ab-gift-cart-caption';prompt.innerHTML=caption();
    var button=document.createElement('a');button.href='/checkout?gift=1';button.className='ab-gift-start';button.setAttribute('data-ab-gift-start','');button.textContent='Gift Order';
    sticky.insertBefore(button,sticky.firstChild);sticky.insertBefore(prompt,sticky.firstChild);
   }
  }
  var host=checkoutOpen()&&document.querySelector('app-checkout');if(host)renderCheckout(host);
  document.querySelectorAll('[data-ab-gift-wrap]').forEach(function(input){input.checked=draft.wrap===true;});
  document.querySelectorAll('.ab-gift-wrap-status').forEach(function(node){setText(node,fee()?'গিফট কভারের জন্য ৳৩০ যোগ হয়েছে।':'গিফট কভার বাদ দেওয়া হয়েছে।');});
 }
 var scheduled=false;
 function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(function(){scheduled=false;update();});}
 function change(event){
  var input=event.target;
  if(input.setCustomValidity&&input.closest('#ab-gift-sender,#ab-gift-recipient'))input.setCustomValidity('');
  if(input.matches('[data-ab-gift-field]'))draft[input.getAttribute('data-ab-gift-field')]=input.value;
  else if(input.matches('[data-ab-gift-recipient]'))draft.recipient[input.getAttribute('data-ab-gift-recipient')]=input.value;
  else if(input.matches('[data-ab-gift-wrap]'))draft.wrap=input.checked;
  else return;
  save();
  if(component){var updateForm=function(){applyRecipient(component);};if(component.__abGiftZone)component.__abGiftZone.run(updateForm);else updateForm();}
  schedule();
 }
 document.addEventListener('input',change);document.addEventListener('change',change);
 document.addEventListener('focusin',schedule);document.addEventListener('focusout',schedule);
 function navigate(event){
  var target=event.target.closest&&event.target.closest('[data-ab-gift-start],[data-ab-gift-regular],[data-ab-gift-confirm]');if(!target)return;
  event.stopImmediatePropagation();if(event.type!=='click')return;
  if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
  event.preventDefault();
  if(target.hasAttribute('data-ab-gift-confirm')){var submit=document.querySelector('app-checkout .confirm-order button[type="submit"]');if(submit&&!submit.disabled)submit.click();return;}
  save();window.location.assign(target.hasAttribute('data-ab-gift-start')?'/checkout?gift=1':'/checkout');
 }
 ['pointerup','touchend','click'].forEach(function(type){window.addEventListener(type,navigate,true);});
 new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
 window.addEventListener('popstate',schedule);window.addEventListener('resize',schedule);window.addEventListener('amol-cart-added',schedule);update();
}());
</script>
