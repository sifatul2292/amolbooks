<script>

    shell.innerHTML = '<div class="ab-account-hub__identity">' +

    document.body.appendChild(dialog);

    dialog.addEventListener('click', function (event) { if (event.target === dialog) dialog.close(); });
    return dialog;
  }
  function activate(target) {
    var dialog = document.getElementById('ab-account-sheet');
    if (dialog && dialog.open) dialog.close();

    if (target === 'address') {
      var address = nativeItems[2] && nativeItems[2].querySelector('a');
      if (address) address.click();
      return;

    if (target === 'logout') {

  function checkoutAuthenticated() {

      return Boolean(window.__abCartAuthorization ||
        localStorage.getItem('Amolbooks_USER_1_1') || localStorage.getItem('ALAMBOOKS_USER_1_1') ||

    control.dispatchEvent(new Event('input', { bubbles: true }));
    control.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function selectCheckoutDelivery(value) {
    var option = document.querySelector('app-checkout input[type="radio"][value="' + value + '"]');
    if (option && !option.checked) option.click();
  }

    if (!authorization || checkoutAddressesPending || Array.isArray(checkoutAddresses)) return;
    checkoutAddressesPending = true;
    fetch(API_BASE + '/user/get-user-address', {
      headers: { Authorization: authorization, Accept: 'application/json' },

  }
  function loadCheckoutProfile() {
    var authorization = checkoutAuthorization();
    if (!authorization || checkoutProfilePending || checkoutProfile) return;
    checkoutProfilePending = true;
    fetch(API_BASE + '/user/logged-in-user-data?select=name%20phoneNo%20username', {
      headers: { Authorization: authorization, Accept: 'application/json' },
      credentials: 'omit'
    }).then(function (response) {
      if (!response.ok) throw new Error('Profile unavailable');
      return response.json();
    }).then(function (result) {
      checkoutProfile = result && result.data || {};
      scheduleMount();
    }).catch(function () {
      checkoutProfile = {};
    }).finally(function () {
      checkoutProfilePending = false;
    });
  }
  function applyCheckoutAddress(component, address, picker) {
    if (!address) return;
    var divisionName = String(address.division && address.division.name || '');
    var areaName = String(address.area && address.area.name || '');
    var dhaka = /Dhaka|ঢাকা/i.test(divisionName);
    var dhakaOutskirts = /Savar|Dohar|Nawabganj|Keraniganj|Dhamrai|সাভার|দোহার|নবাবগঞ্জ|কেরানীগঞ্জ|ধামরাই/i.test(areaName);
    var deliveryOption = dhaka && !dhakaOutskirts ? '1' : '2';
    if (component) {
      component.homeAddress = address;
      component.formData.patchValue({
        name: address.name || component.user && component.user.name || '',
        phoneNo: address.phone || address.phoneNo || component.user && component.user.phoneNo || '',
        division: address.division && address.division._id || null,
        area: address.area && address.area._id || null,
        zone: address.zone && address.zone._id || null,
        address: address.address || '',
        addressType: address.addressType || 'home',
        deliveryOptions: deliveryOption
      });
    } else {
      setCheckoutControl('name', address.name || checkoutProfile && checkoutProfile.name || '');
      if (address.phone || address.phoneNo || checkoutProfile && (checkoutProfile.phoneNo || checkoutProfile.username)) {
        setCheckoutControl('phoneNo', address.phone || address.phoneNo || checkoutProfile.phoneNo || checkoutProfile.username);
      }
      setCheckoutControl('address', address.address || '');
      selectCheckoutDelivery(deliveryOption);
    }
    if (component && !component.__abSavedAddressDeliveryCharge && typeof component.calculateDeliveryCharge === 'function') {
      var calculateDeliveryCharge = component.calculateDeliveryCharge;
      component.calculateDeliveryCharge = function () {
        var shipping = this.shippingCharge;
        var option = this.formData && this.formData.value && this.formData.value.deliveryOptions;
        var base = Number(shipping && (option === '1' ? shipping.deliveryInDhaka : shipping.deliveryOutsideDhaka));
        return Number.isFinite(base) && base > 0 ? base : calculateDeliveryCharge.call(this);
      };
      component.__abSavedAddressDeliveryCharge = true;
    }
    if (component && address.division && address.division._id) component.getAllArea(address.division._id);
    if (component && address.area && address.area._id) component.getAllZone(address.area._id);
    picker.dataset.selectedAddress = address._id || '';
    picker.querySelectorAll('.ab-checkout-address').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.addressId === picker.dataset.selectedAddress));
    });
  }
  function mountCheckoutAddresses() {
    var oldPicker = document.querySelector('.ab-checkout-addresses');
    if (location.pathname !== '/checkout') {
      if (oldPicker) oldPicker.remove();
      return;
    }
    var host = document.querySelector('app-checkout');
    var component = findCheckoutComponent(host);
    var addresses = component && component.addresses;
    if (!Array.isArray(addresses)) addresses = checkoutAddresses;
    var formArea = host && host.querySelector('.address-form-area');
    if (!formArea) return;
    if (!component && checkoutAuthenticated()) {
      loadCheckoutAddresses();
      loadCheckoutProfile();
    }
    if (!Array.isArray(addresses)) {
      if (component && checkoutAuthenticated() && !component.__abRequestedSavedAddresses) {
        component.__abRequestedSavedAddresses = true;
        component.getUserAddress();
      }
      return;
    }
    if (!addresses.length) return;
    var signature = addresses.map(function (address) { return address._id; }).join('|');
    var picker = oldPicker;
    if (!picker || picker.dataset.signature !== signature) {
      if (picker) picker.remove();
      picker = document.createElement('section');
      picker.className = 'ab-checkout-addresses';
      picker.dataset.signature = signature;
      picker.setAttribute('aria-labelledby', 'ab-checkout-addresses-title');
      picker.innerHTML = '<h3 class="ab-checkout-addresses__title" id="ab-checkout-addresses-title">সংরক্ষিত ঠিকানা থেকে বেছে নিন</h3>' +
        '<div class="ab-checkout-addresses__list">' + addresses.map(function (address) {
          return '<button type="button" class="ab-checkout-address" data-address-id="' + escapeHtml(address._id) + '" aria-pressed="false">' +
            '<div class="ab-checkout-address__name">' + escapeHtml(address.name || address.addressType || 'ঠিকানা') + '</div>' +
            '<span>' + escapeHtml(addressLine(address)) + '</span></button>';
        }).join('') + '</div>';
      var heading = formArea.querySelector('.address-form-top');
      if (heading && heading.nextSibling) formArea.insertBefore(picker, heading.nextSibling);
      else formArea.insertBefore(picker, formArea.firstChild);
      picker.addEventListener('click', function (event) {
        var button = event.target.closest('.ab-checkout-address');
        if (!button) return;
        var selected = addresses.find(function (address) { return address._id === button.dataset.addressId; });
        applyCheckoutAddress(component, selected, picker);
      });
      var preferred = addresses.find(function (address) { return address.setDefaultAddress; }) ||
        addresses.find(function (address) { return address.addressType === 'home'; }) || addresses[0];
      applyCheckoutAddress(component, preferred, picker);
    }
    picker.querySelectorAll('.ab-checkout-address img').forEach(function (image) {
      var wrapper = image.parentElement;
      image.remove();
      if (wrapper && wrapper !== picker && !wrapper.textContent.trim() && !wrapper.querySelector('img')) wrapper.remove();
    });
    if (!component && checkoutProfile && !picker.dataset.profileApplied) {
      var selectedId = picker.dataset.selectedAddress;
      var selectedAddress = addresses.find(function (address) { return address._id === selectedId; }) || addresses[0];
      picker.dataset.profileApplied = 'true';
      applyCheckoutAddress(null, selectedAddress, picker);
    }
    var phoneControl = !component && document.querySelector('app-checkout [formcontrolname="phoneNo"]');
    if (phoneControl && !phoneControl.value && checkoutProfile && (checkoutProfile.phoneNo || checkoutProfile.username)) {
      setCheckoutControl('phoneNo', checkoutProfile.phoneNo || checkoutProfile.username);
    }
  }
  function sync(shell) {
    var nativeImage = document.querySelector('app-account .account-left .user-img img');
    var nativeName = document.querySelector('app-account .account-left .user-text h3');
    var avatar = shell.querySelector('.ab-account-hub__avatar');
    var name = shell.querySelector('.ab-account-hub__name');
    var section = shell.querySelector('.ab-account-hub__section');
    var active = currentItem();
    var src = nativeImage && nativeImage.currentSrc || nativeImage && nativeImage.src;
    if (src && avatar.src !== src) avatar.src = src;
    var userName = nativeName && nativeName.textContent.trim();
    if (userName && name.textContent !== userName) name.textContent = userName;
    if (section.textContent !== active.label) section.textContent = active.label;
    shell.querySelectorAll('[data-account-target]').forEach(function (link) {
      var selected = link.getAttribute('data-account-target') === active.route;
      if (selected && link.getAttribute('aria-current') !== 'page') link.setAttribute('aria-current', 'page');
      else if (!selected && link.hasAttribute('aria-current')) link.removeAttribute('aria-current');
    });
    var dialog = document.getElementById('ab-account-sheet');
    if (dialog) dialog.querySelectorAll('[data-account-target]').forEach(function (link) {
      var selected = link.getAttribute('data-account-target') === active.route;
      if (selected && link.getAttribute('aria-current') !== 'page') link.setAttribute('aria-current', 'page');
      else if (!selected && link.hasAttribute('aria-current')) link.removeAttribute('aria-current');
    });
  }
  function mount() {
    scheduled = false;
    var shell = document.querySelector('.ab-account-hub');
    var dialog = document.getElementById('ab-account-sheet');
    mountCheckoutAddresses();
    if (!isAccountPage()) {
      if (shell) shell.remove();
      if (dialog) dialog.remove();
      return;
    }
    var accountRight = document.querySelector('app-account .account-right');
    if (!accountRight) return;
    if (!shell) {
      shell = buildShell();
      accountRight.insertBefore(shell, accountRight.firstChild);
      shell.querySelector('.ab-account-hub__menu').addEventListener('click', function () {
        var menu = document.getElementById('ab-account-sheet') || buildDialog();
        menu.showModal();
        requestAnimationFrame(function () {
          var first = menu.querySelector('[aria-current="page"]') || menu.querySelector('.ab-account-action');
          if (first) first.focus({ preventScroll: true });
        });
      });
    }
    if (!dialog) dialog = buildDialog();
    sync(shell);
  }
  function scheduleMount() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(mount);
  }
  document.addEventListener('click', function (event) {
    var link = event.target && event.target.closest && event.target.closest('[data-account-target]');
    if (!link) return;
    event.preventDefault();
    activate(link.getAttribute('data-account-target'));
  });
  window.addEventListener('popstate', scheduleMount);
  window.addEventListener('ab-cart-authorization', scheduleMount);
  new MutationObserver(scheduleMount).observe(document.documentElement, { childList: true, subtree: true });
  window.setInterval(function () {
    if (location.pathname === '/checkout') scheduleMount();
  }, 800);
  scheduleMount();
})();
</script>
